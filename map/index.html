<style>
/* ---- Design tokens (copied from Adyen house reference) ---- */
:root {
  --brand-green-50:#EBF8EE; --brand-green-100:#CFEFD8; --brand-green-200:#9FDFB1;
  --brand-green-300:#6CCE89; --brand-green-400:#3FBB65; --brand-green-500:#1FA84A;
  --brand-green-600:#15893B; --brand-green-700:#0F6B2E;
  --brand-navy-50:#EEF2F7; --brand-navy-100:#D6DEE9; --brand-navy-200:#ADBCCE;
  --brand-navy-300:#7E93AE; --brand-navy-400:#4F6B8A; --brand-navy-500:#2C4868;
  --brand-navy-600:#1E3551; --brand-navy-700:#14273F; --brand-navy-800:#0D1B2D;
  --neutral-0:#FFFFFF; --neutral-50:#F7F8FA; --neutral-100:#EEF0F3; --neutral-200:#DEE2E8;
  --neutral-300:#C3CAD3; --neutral-400:#9BA5B1; --neutral-500:#6E7887; --neutral-600:#4C5665;
  --neutral-700:#343D4C; --neutral-800:#1F2733;
  /* chart series tones - theme-aware (lighter in dark mode for contrast) */
  --ct-500:var(--brand-navy-500); --ct-400:var(--brand-navy-400); --ct-300:var(--brand-navy-300); --ct-600:var(--brand-navy-600); --ct-grey:var(--neutral-400);
  --accent-ochre:#C98A2B; --accent-terra:#B25838;
  --danger:#C8412F; --warning:#D89B1F;
  --bg:var(--neutral-0); --bg-muted:var(--neutral-50); --bg-sunken:var(--neutral-100);
  --surface:var(--neutral-0);
  --fg-1:var(--brand-navy-800); --fg-2:var(--neutral-700); --fg-3:var(--neutral-500);
  --fg-brand:var(--brand-green-600);
  --border-subtle:var(--neutral-200); --border-default:var(--neutral-300);
  --font-sans:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --font-serif:"Source Serif 4",ui-serif,Georgia,serif;
  --shadow-xs:0 1px 2px rgba(20,39,63,.05); --shadow-sm:0 1px 3px rgba(20,39,63,.06);
  --shadow-md:0 4px 12px -4px rgba(20,39,63,.08),0 1px 3px rgba(20,39,63,.04);
  --shadow-lg:0 16px 32px -8px rgba(20,39,63,.14),0 4px 8px rgba(20,39,63,.05);
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-xl:20px; --radius-pill:999px;
  --ease:cubic-bezier(.2,.8,.2,1); --dur-fast:140ms; --dur-base:220ms; --container:1200px;
}
[data-theme="dark"] {
  --bg:#0A1220; --bg-muted:#0D1B2D; --bg-sunken:#14273F; --surface:#0F1E32;
  --fg-1:#E7ECF3; --fg-2:#B6C2D1; --fg-3:#7E93AE; --fg-brand:var(--brand-green-400);
  --border-subtle:#1F3350; --border-default:#2C4868;
  --ct-500:var(--brand-navy-300); --ct-400:var(--brand-navy-200); --ct-300:var(--brand-navy-200); --ct-600:var(--brand-navy-200); --ct-grey:var(--neutral-300);
}
* { box-sizing: border-box; }
html { font-family:var(--font-sans); color:var(--fg-1); background:var(--bg); scroll-behavior:smooth; scroll-padding-top:120px; }
body { margin:0; font-size:16px; line-height:1.55; color:var(--fg-2); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; background:var(--bg); transition:background var(--dur-base) var(--ease); }
h1,h2,h3,h4,h5 { font-family:var(--font-sans); color:var(--fg-1); margin:0; letter-spacing:-.02em; }
h1 { font-size:40px; font-weight:800; line-height:1.1; letter-spacing:-.03em; }
h2 { font-size:25px; font-weight:700; line-height:1.2; }
h3 { font-size:18px; font-weight:700; line-height:1.3; }
h4 { font-size:15px; font-weight:600; }
p { margin:0 0 12px; text-wrap:pretty; }
small { font-size:12px; color:var(--fg-3); }
.eyebrow { font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--fg-brand); }
.container { max-width:var(--container); margin:0 auto; padding:0 28px; }

/* ---- Scroll progress ---- */
.scroll-progress { position:fixed; top:0; left:0; height:2px; width:0%; background:var(--brand-green-500); z-index:100; transition:width 80ms linear; }

/* ---- Site header ---- */
.site-header { position:sticky; top:0; z-index:50; background:rgba(255,255,255,.92); backdrop-filter:saturate(180%) blur(12px); -webkit-backdrop-filter:saturate(180%) blur(12px); border-bottom:1px solid var(--border-subtle); }
[data-theme="dark"] .site-header { background:rgba(10,18,32,.88); }
.header-inner { max-width:var(--container); margin:0 auto; padding:12px 28px; display:flex; align-items:center; gap:24px; }
.brand { display:flex; align-items:center; gap:10px; text-decoration:none; line-height:1; }
.brand-mark { width:26px; height:26px; flex-shrink:0; transform:translateY(-1px); }
.brand-text { font-weight:800; font-size:17px; color:var(--fg-1); letter-spacing:-.02em; }
.header-tools { display:flex; gap:6px; align-items:center; margin-left:auto; }
.icon-btn { background:transparent; border:1px solid var(--border-subtle); color:var(--fg-2); width:34px; height:34px; border-radius:var(--radius-sm); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; transition:all var(--dur-fast) var(--ease); padding:0; }
.icon-btn:hover { background:var(--bg-sunken); color:var(--fg-1); border-color:var(--border-default); }
.icon-btn svg { width:16px; height:16px; }

/* ---- Sources download menu (header, top-right) ---- */
.src-menu { position:relative; }
.src-btn { display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 12px; background:transparent; border:1px solid var(--border-subtle); color:var(--fg-2); border-radius:var(--radius-sm); cursor:pointer; font-family:var(--font-sans); font-size:13px; font-weight:600; transition:all var(--dur-fast) var(--ease); }
.src-btn:hover, .src-btn[aria-expanded="true"] { background:var(--bg-sunken); color:var(--fg-1); border-color:var(--border-default); }
.src-btn svg { width:15px; height:15px; flex-shrink:0; }
.src-panel { position:absolute; right:0; top:calc(100% + 8px); width:330px; max-width:86vw; background:var(--surface); border:1px solid var(--border-subtle); border-radius:var(--radius-md); box-shadow:var(--shadow-lg); padding:8px; z-index:80; }
.src-panel[hidden] { display:none; }
.src-panel h5 { font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-3); margin:12px 8px 4px; }
.src-panel h5:first-child { margin-top:4px; }
.src-doc { display:flex; align-items:center; gap:11px; padding:9px 8px; border-radius:var(--radius-sm); color:var(--fg-1); text-decoration:none; transition:background var(--dur-fast) var(--ease); }
.src-doc:hover { background:var(--bg-sunken); }
.src-doc .ic { color:var(--fg-brand); flex-shrink:0; display:inline-flex; }
.src-doc .meta { min-width:0; }
.src-doc .t { display:block; font-size:13px; font-weight:600; line-height:1.3; color:var(--fg-1); }
.src-doc .s { display:block; font-size:11px; color:var(--fg-3); margin-top:1px; }
@media (max-width:520px) { .src-btn-label { display:none; } .src-btn { padding:0; width:34px; justify-content:center; } }

/* ---- Hero ---- */
.hero { padding:60px 0 30px; background:radial-gradient(900px 400px at 90% -60px,rgba(31,168,74,.07),transparent 60%),radial-gradient(700px 360px at 5% 0%,rgba(20,39,63,.04),transparent 60%); }
[data-theme="dark"] .hero { background:radial-gradient(900px 400px at 90% -60px,rgba(31,168,74,.12),transparent 60%),radial-gradient(700px 360px at 5% 0%,rgba(78,107,138,.16),transparent 60%); }
.hero .eyebrow { margin-bottom:12px; }
.hero h1 { max-width:920px; margin-bottom:16px; }
.hero .lede { font-size:18px; line-height:1.55; color:var(--fg-2); max-width:860px; margin-bottom:24px; }

/* ---- Key facts / KPI tiles ---- */
.key-facts { display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:16px; max-width:1000px; }
.key-facts .kf { position:relative; cursor:help; padding:14px 16px; border-left:3px solid var(--border-default); transition:border-left-color var(--dur-fast) var(--ease),padding var(--dur-fast) var(--ease); }
.key-facts .kf:hover { border-left-color:var(--brand-green-500); padding-left:18px; padding-right:14px; }
.key-facts .kf small { display:inline-block; font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--fg-3); margin-bottom:6px; border-bottom:1px dotted var(--border-default); }
.key-facts .kf:hover small { color:var(--fg-2); border-bottom-color:var(--brand-green-400); }
.key-facts .kf strong { display:block; font-size:32px; color:var(--fg-1); font-weight:800; line-height:1.05; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
/* Professionally-styled hover tooltip explaining each headline instrument */
.key-facts .kf-tip {
  position:absolute; top:calc(100% + 11px); left:0; width:max-content; max-width:290px;
  background:var(--brand-navy-800); color:#fff; font-family:var(--font-sans); font-weight:500;
  font-size:12.5px; line-height:1.5; letter-spacing:0; text-transform:none; text-align:left;
  padding:12px 15px; border-radius:var(--radius-md); box-shadow:var(--shadow-lg);
  opacity:0; pointer-events:none; transform:translateY(-5px);
  transition:opacity var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease); z-index:70;
}
.key-facts .kf:hover .kf-tip, .key-facts .kf:focus-within .kf-tip { opacity:1; transform:translateY(0); }
.key-facts .kf:last-child .kf-tip { left:auto; right:0; }
.key-facts .kf-tip::before { content:""; position:absolute; bottom:100%; left:22px; border:6px solid transparent; border-bottom-color:var(--brand-navy-800); }
.key-facts .kf:last-child .kf-tip::before { left:auto; right:22px; }
[data-theme="dark"] .key-facts .kf-tip { background:var(--brand-navy-600); border:1px solid var(--border-default); }
[data-theme="dark"] .key-facts .kf-tip::before { border-bottom-color:var(--brand-navy-600); }
@media print { .key-facts .kf-tip { display:none!important; } }
.kpi-note { font-size:12px; color:var(--fg-3); margin:12px 0 0; }
.delta { font-size:12px; font-weight:600; color:var(--brand-green-600); margin-left:4px; }
.delta:not(:empty) { background:var(--brand-green-50); padding:2px 6px; border-radius:var(--radius-pill); }
[data-theme="dark"] .delta:not(:empty) { background:rgba(31,168,74,.14); color:var(--brand-green-300); }

/* ---- Tab bar ---- */
.tabbar { position:sticky; top:51px; z-index:40; background:var(--bg); border-bottom:1px solid var(--border-subtle); }
[data-theme="dark"] .tabbar { background:var(--bg); }
.tabbar-inner { max-width:var(--container); margin:0 auto; padding:0 28px; display:flex; gap:4px; overflow-x:auto; }
.tab-btn { background:transparent; border:none; border-bottom:2px solid transparent; color:var(--fg-3); padding:14px 16px; font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer; transition:color var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease); white-space:nowrap; }
.tab-btn:hover { color:var(--fg-1); }
.tab-btn.active { color:var(--brand-green-700); border-bottom-color:var(--brand-green-500); }
.tab-btn .tnum { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:50%; background:var(--bg-sunken); color:var(--fg-3); font-size:11px; margin-right:7px; }
.tab-btn.active .tnum { background:var(--brand-green-500); color:#fff; }

/* ---- Main content area ---- */
#views { padding:40px 0; min-height:400px; }

/* ---- Footer ---- */
.site-footer { margin-top:24px; padding:28px 0 48px; border-top:1px solid var(--border-subtle); color:var(--fg-3); font-size:12px; }
.site-footer h4 { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-3); margin-bottom:12px; }
.footer-grid { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:32px 48px; align-items:start; }
.footer-sources, .footer-notes { min-width:0; }
.srclist { margin:0; padding-left:18px; }
.srclist li { margin-bottom:5px; line-height:1.5; color:var(--fg-2); }
.srclist a.src-dl { color:var(--fg-2); text-decoration:none; display:inline-flex; align-items:baseline; gap:5px; transition:color var(--dur-fast) var(--ease); }
.srclist a.src-dl:hover, .srclist a.src-dl:focus { color:var(--fg-brand); text-decoration:underline; outline:none; }
.srclist a.src-dl .dl-ic { flex-shrink:0; align-self:center; opacity:.7; }
.srclist a.src-dl:hover .dl-ic { opacity:1; }
.srclist a.src-dl .src-sz { color:var(--fg-3); font-size:11px; }
.note { font-size:12px; color:var(--fg-3); line-height:1.6; margin-bottom:10px; }
.footer-notes .note:last-child { margin-bottom:0; }
.footer-stamp { font-weight:600; color:var(--fg-2); padding-top:4px; border-top:1px solid var(--border-subtle); }

/* ---- Empty-state placeholder ---- */
.view-placeholder { padding:60px 0; text-align:center; color:var(--fg-3); font-size:14px; }

/* ============================================================
   Data-viz views (MAP & APA) — charts, chips, callouts, tiles
   ============================================================ */

/* View header */
.view-head { margin-bottom:20px; }
.view-head h2 { margin-bottom:6px; }
.view-head .lede { font-size:15px; line-height:1.5; color:var(--fg-2); max-width:780px; margin:0; }

/* Chip / toggle row */
.chip-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
.chip-row .chip-label { align-self:center; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--fg-3); margin-right:2px; }
.chip { --chip:var(--brand-navy-400); display:inline-flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--border-default); color:var(--fg-2); font-family:var(--font-sans); font-size:12.5px; font-weight:600; padding:6px 13px; border-radius:var(--radius-pill); cursor:pointer; transition:all var(--dur-fast) var(--ease); white-space:nowrap; }
.chip::before { content:""; width:9px; height:9px; border-radius:50%; background:var(--chip); opacity:.32; transition:opacity var(--dur-fast) var(--ease); flex-shrink:0; }
.chip:hover { border-color:var(--chip); color:var(--fg-1); }
.chip.on { border-color:var(--chip); color:var(--fg-1); background:color-mix(in srgb,var(--chip) 12%,var(--surface)); }
.chip.on::before { opacity:1; }
/* Plain chips (years/streams without a colour dot) */
.chip.plain::before { display:none; }
.chip.plain.on { background:var(--brand-green-500); color:#fff; border-color:var(--brand-green-500); }
[data-theme="dark"] .chip.plain.on { background:var(--brand-green-600); border-color:var(--brand-green-600); }

/* Chart card + svg */
.chart-card { background:var(--surface); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:20px 22px; margin-bottom:20px; box-shadow:var(--shadow-sm); }
.chart-wrap { position:relative; width:100%; }
.chart { display:block; width:100%; height:auto; overflow:visible; }
.chart .grid { stroke:var(--border-subtle); stroke-width:1; stroke-dasharray:2 3; }
.chart .axis { stroke:var(--border-default); stroke-width:1; }
.chart .ytick { font-size:11px; fill:var(--fg-3); font-weight:600; text-anchor:end; font-variant-numeric:tabular-nums; }
.chart .xtick { font-size:11px; fill:var(--fg-3); font-weight:600; text-anchor:middle; }
.chart .barval { font-size:11px; fill:var(--fg-1); font-weight:700; text-anchor:middle; font-variant-numeric:tabular-nums; }
.chart .dot { transition:r var(--dur-fast) var(--ease); }
.chart .hit { cursor:pointer; }
.chart .norm { stroke:var(--warning); stroke-width:1.5; stroke-dasharray:5 4; }
.chart .normlbl { font-size:10.5px; fill:var(--accent-ochre); font-weight:700; text-anchor:end; }
.chart .db-lbl { font-size:12.5px; fill:var(--fg-1); font-weight:600; text-anchor:end; }
.chart .db-delta { font-size:12px; font-weight:800; text-anchor:start; font-variant-numeric:tabular-nums; }
.chart-legend .db-sw { width:11px; height:11px; border-radius:50%; flex-shrink:0; }
.chart-legend .db-sw.open { background:var(--surface); border:2px solid var(--ct-grey); }
.chart-legend .db-sw.filled { background:currentColor; }

/* Chart legend */
.chart-legend { display:flex; gap:18px; flex-wrap:wrap; font-size:12px; color:var(--fg-3); margin-top:12px; }
.chart-legend .lg { display:inline-flex; align-items:center; gap:7px; }
.chart-legend .sw { width:16px; height:3px; border-radius:2px; background:currentColor; flex-shrink:0; }
.chart-legend .sw.dashed { background:repeating-linear-gradient(to right,currentColor 0,currentColor 4px,transparent 4px,transparent 8px); }

/* Tooltip (positioned inside .chart-wrap) */
.tooltip { position:absolute; background:var(--brand-navy-800); color:#fff; padding:8px 11px; border-radius:var(--radius-sm); font-size:12px; line-height:1.45; pointer-events:none; opacity:0; transition:opacity var(--dur-fast) var(--ease); box-shadow:var(--shadow-md); z-index:10; font-variant-numeric:tabular-nums; white-space:nowrap; transform:translate(-50%,-110%); }
.tooltip.show { opacity:1; }
.tooltip b { color:#fff; font-weight:700; }
[data-theme="dark"] .tooltip { background:var(--brand-navy-600); border:1px solid var(--border-default); }

/* ---- Glossary term (hover to define technical terms) ---- */
.gloss { border-bottom:1px dotted var(--fg-3); cursor:help; position:relative; text-decoration:none; }
.gloss:hover, .gloss:focus { color:var(--fg-1); border-bottom-color:var(--brand-green-500); outline:none; }
.gloss::after {
  content:attr(data-def); position:absolute; left:50%; bottom:calc(100% + 9px);
  transform:translateX(-50%); width:max-content; max-width:260px; white-space:normal; text-align:left;
  background:var(--brand-navy-800); color:#fff; font-family:var(--font-sans); font-weight:500;
  font-size:12px; line-height:1.45; letter-spacing:0; text-transform:none;
  padding:9px 12px; border-radius:var(--radius-sm); box-shadow:var(--shadow-lg);
  opacity:0; pointer-events:none; transition:opacity var(--dur-fast) var(--ease); z-index:60;
}
.gloss::before {
  content:""; position:absolute; left:50%; bottom:calc(100% + 4px); transform:translateX(-50%);
  border:5px solid transparent; border-top-color:var(--brand-navy-800);
  opacity:0; pointer-events:none; transition:opacity var(--dur-fast) var(--ease); z-index:60;
}
.gloss:hover::after, .gloss:focus::after, .gloss:hover::before, .gloss:focus::before { opacity:1; }
[data-theme="dark"] .gloss::after { background:var(--brand-navy-600); border:1px solid var(--border-default); }
[data-theme="dark"] .gloss::before { border-top-color:var(--brand-navy-600); }
@media print { .gloss { border-bottom:none; } .gloss::after, .gloss::before { display:none!important; } }

/* Generic panel (used by timing / TP views) */
.panel { background:var(--surface); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:20px 22px; margin-bottom:20px; box-shadow:var(--shadow-sm); }
.panel > h4 { font-size:13px; font-weight:700; color:var(--fg-1); margin-bottom:14px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.panel > h4 small { font-size:11px; font-weight:500; color:var(--fg-3); letter-spacing:0; text-transform:none; }

/* Outcomes — horizontal bars grouped by phase */
.outcols h4 { font-size:13px; font-weight:700; color:var(--fg-1); margin:18px 0 10px; display:flex; align-items:baseline; gap:8px; }
.outcols h4:first-child { margin-top:0; }
.outcols h4 .osub { font-size:12px; font-weight:700; color:var(--fg-brand); background:var(--brand-green-50); padding:1px 9px; border-radius:var(--radius-pill); font-variant-numeric:tabular-nums; }
[data-theme="dark"] .outcols h4 .osub { background:rgba(31,168,74,.16); color:var(--brand-green-300); }
.obar { display:grid; grid-template-columns:minmax(180px,260px) 1fr 44px; align-items:center; gap:12px; padding:4px 0; }
.olabel { font-size:13px; color:var(--fg-2); line-height:1.35; }
.otrack { position:relative; height:18px; background:var(--bg-sunken); border-radius:var(--radius-sm); overflow:hidden; }
.ofill { display:block; height:100%; border-radius:var(--radius-sm); min-width:2px; transition:width var(--dur-base) var(--ease); }
.oval { font-size:13px; font-weight:700; color:var(--fg-1); text-align:right; font-variant-numeric:tabular-nums; }
.out-readout { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px; }
.out-readout .ror { background:var(--surface); border:1px solid var(--border-subtle); border-left:3px solid var(--brand-green-500); border-radius:var(--radius-sm); padding:10px 14px; box-shadow:var(--shadow-xs); }
.out-readout .ror small { display:block; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--fg-3); margin-bottom:3px; }
.out-readout .ror strong { font-size:18px; font-weight:800; color:var(--fg-1); font-variant-numeric:tabular-nums; }

/* Treaty-partner horizontal bars */
.pbars { display:flex; flex-direction:column; gap:9px; }
.pbar { display:grid; grid-template-columns:150px 1fr 48px; align-items:center; gap:12px; }
.plabel { font-size:13px; color:var(--fg-2); font-weight:600; }
.ptrack { position:relative; height:20px; background:var(--bg-sunken); border-radius:var(--radius-sm); overflow:hidden; }
.pfill { display:block; height:100%; background:linear-gradient(90deg,var(--brand-navy-400),var(--brand-navy-500)); border-radius:var(--radius-sm); min-width:2px; transition:width var(--dur-base) var(--ease); }
.pval { font-size:13px; font-weight:700; color:var(--fg-1); text-align:right; font-variant-numeric:tabular-nums; }
.partner-foot { font-size:12px; color:var(--fg-3); margin:12px 0 0; }

/* Takeaway callout (Source-Serif, inRange voice) */
.takeaway { background:var(--surface); border:1px solid var(--border-subtle); border-left:4px solid var(--brand-green-500); border-radius:var(--radius-md); padding:14px 18px; margin:16px 0 0; box-shadow:var(--shadow-xs); font-family:var(--font-serif); font-size:15px; line-height:1.5; color:var(--fg-1); }

/* Method explainer (clearly-labelled inRange commentary) */
.explainer { background:linear-gradient(135deg,var(--brand-navy-50) 0%,var(--surface) 70%); border:1px solid var(--border-subtle); border-left:4px solid var(--accent-ochre); border-radius:var(--radius-md); padding:18px 22px; margin:36px 0 8px; box-shadow:var(--shadow-xs); }
[data-theme="dark"] .explainer { background:linear-gradient(135deg,rgba(78,107,138,.16) 0%,var(--surface) 70%); }
.explainer .eyebrow { color:var(--accent-ochre); margin-bottom:8px; }
.explainer p:not(.eyebrow) { font-family:var(--font-serif); font-size:15px; line-height:1.55; color:var(--fg-1); margin:0; }

/* ============================================================
   International Rulings views — section headers, cards
   ============================================================ */

/* Chart-card section header (e.g. "Requests over time, by instrument") */
.stack-h { font-size:13px; font-weight:700; color:var(--fg-1); margin:18px 0 9px; display:flex; align-items:baseline; gap:8px; }
.stack-h:first-child { margin-top:0; }
.stack-h .osub { font-size:12px; font-weight:700; color:var(--fg-brand); background:var(--brand-green-50); padding:1px 9px; border-radius:var(--radius-pill); font-variant-numeric:tabular-nums; }
[data-theme="dark"] .stack-h .osub { background:rgba(31,168,74,.16); color:var(--brand-green-300); }

/* Defining-positions cards (prominent inRange commentary) */
.pos-group { font-size:13px; font-weight:700; color:var(--fg-1); margin:24px 0 12px; padding-bottom:7px; border-bottom:1px solid var(--border-subtle); }
.pos-group:first-of-type { margin-top:0; }
.positions { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; margin-bottom:8px; align-items:start; }
.position { background:linear-gradient(135deg,var(--brand-navy-50) 0%,var(--surface) 60%); border:1px solid var(--border-subtle); border-left:4px solid var(--brand-green-500); border-radius:var(--radius-md); padding:18px 20px; box-shadow:var(--shadow-xs); transition:transform var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease); }
.position:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); }
[data-theme="dark"] .position { background:linear-gradient(135deg,rgba(78,107,138,.14) 0%,var(--surface) 60%); }
.position .eyebrow { color:var(--brand-green-600); margin-bottom:8px; }
[data-theme="dark"] .position .eyebrow { color:var(--brand-green-400); }
.position h3 { font-size:15px; margin-bottom:7px; line-height:1.25; }
.position p:not(.eyebrow) { font-family:var(--font-serif); font-size:14.5px; line-height:1.55; color:var(--fg-1); margin:0; }
.position .pos-body { position:relative; }
.position.is-clamped .pos-body { max-height:4.65em; overflow:hidden; }
.position.is-clamped .pos-body::after { content:""; position:absolute; left:0; right:0; bottom:0; height:1.6em; background:linear-gradient(to bottom,transparent,var(--surface)); pointer-events:none; }
.position.is-clamped.expanded .pos-body { max-height:none; }
.position.is-clamped.expanded .pos-body::after { display:none; }
.pos-more { display:inline-flex; align-items:center; gap:5px; margin-top:11px; padding:0; background:none; border:none; cursor:pointer; font-family:var(--font-sans); font-size:13px; font-weight:600; color:var(--brand-green-600); }
.pos-more:hover { text-decoration:underline; }
[data-theme="dark"] .pos-more { color:var(--brand-green-400); }
.pos-more .chev { transition:transform var(--dur-fast) var(--ease); }
.position.expanded .pos-more .chev { transform:rotate(180deg); }
/* Year colour-coding: newest = green, then navy, then ochre (left border + eyebrow) */
.position.yr-2025 { border-left-color:var(--brand-green-500); }
.position.yr-2025 .eyebrow { color:var(--brand-green-600); }
[data-theme="dark"] .position.yr-2025 .eyebrow { color:var(--brand-green-400); }
.position.yr-2024 { border-left-color:var(--brand-navy-400); }
.position.yr-2024 .eyebrow { color:var(--brand-navy-500); }
[data-theme="dark"] .position.yr-2024 .eyebrow { color:var(--brand-navy-200); }
.position.yr-2023 { border-left-color:var(--accent-ochre); }
.position.yr-2023 .eyebrow { color:var(--accent-ochre); }
.position.yr-2022 { border-left-color:var(--accent-terra); }
.position.yr-2022 .eyebrow { color:var(--accent-terra); }
.position.yr-2021 { border-left-color:var(--neutral-400); }
.position.yr-2021 .eyebrow { color:var(--fg-3); }
/* Year legend for the cards */
.yr-legend { display:flex; flex-wrap:wrap; gap:16px; margin:12px 0 0; font-size:12px; font-weight:600; color:var(--fg-3); }
.yr-legend .yl { display:inline-flex; align-items:center; gap:7px; }
.yr-legend .yl i { width:20px; height:4px; border-radius:2px; display:inline-block; }

/* ---- Responsive ---- */
@media (max-width:720px) {
  h1 { font-size:28px; }
  .hero { padding:40px 0 24px; }
  .container { padding:0 18px; }
  .key-facts { grid-template-columns:1fr 1fr; }
  .tabbar-inner { padding:0 14px; }
  .obar { grid-template-columns:1fr 40px; }
  .obar .otrack { grid-column:1 / -1; order:3; }
  .pbar { grid-template-columns:110px 1fr 42px; gap:8px; }
  .chart-card, .panel { padding:16px 16px; }
  .positions { grid-template-columns:1fr; }
  .footer-grid { grid-template-columns:1fr; gap:24px; }
}
@media (max-width:420px) {
  h1 { font-size:25px; }
  .container { padding:0 14px; }
  .key-facts { grid-template-columns:1fr; gap:10px; }
  /* Treaty-partner long labels (e.g. "United Kingdom") get more room. */
  .pbar { grid-template-columns:1fr 40px; gap:6px 10px; }
  .pbar .ptrack { grid-column:1 / -1; order:3; height:16px; }
  .chart-card, .panel { padding:14px 13px; }
}

/* ---- Print ----
   A tab SPA can't honestly print every tab — only the active one is in the DOM.
   So we print the CURRENTLY-ACTIVE tab cleanly: hide all interactive chrome
   (header/theme button, scroll bar, tab bar, chips), keep the hero title + lede
   + KPIs for context, and keep the data footer.
   Charts scale via viewBox so nothing clips. */
@media print {
  .site-header, .scroll-progress, .tabbar, .chip-row { display:none!important; }
  html, body { background:#fff!important; color:#000; }
  body { font-size:11pt; }
  .hero { padding:0 0 16px; background:none; }
  .hero h1 { font-size:24pt; }
  .hero .lede { font-size:12pt; margin-bottom:16px; }
  #views { padding:16px 0 0; min-height:0; }
  .chart-card, .panel, .explainer, .takeaway, .position, .out-readout .ror, .obar, .pbar
    { break-inside:avoid; box-shadow:none; }
  .chart-card, .panel { border-color:var(--border-default); }
  /* Force chart/cell fills to render in print (browsers strip backgrounds by default). */
  .chart, .ofill, .pfill, .delta:not(:empty), .osub
    { print-color-adjust:exact; -webkit-print-color-adjust:exact; }
  .site-footer { margin-top:16px; padding-top:16px; break-inside:avoid; }
}

<script>
(function () {
  "use strict";

  // ---- Theme toggle (initial theme set by the <head> script; default = dark) ----
  (function () {
    document.getElementById('themeBtn').addEventListener('click', function () {
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      var next = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('ir-theme', next);
    });
  })();

  // ---- Sources download menu (header, top-right) ----
  (function () {
    function fmtMB(b) { return (b / 1048576).toFixed(1) + ' MB'; }
    var fileIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
    function group(title, arr) {
      return '<h5>' + title + '</h5>' + arr.map(function (s) {
        return '<a class="src-doc" href="' + s.file + '" download role="menuitem">' +
          '<span class="ic">' + fileIcon + '</span>' +
          '<span class="meta"><span class="t">' + s.title + '</span><span class="s">PDF &middot; ' + fmtMB(s.bytes) + '</span></span></a>';
      }).join('');
    }
    document.getElementById('srcPanel').innerHTML =
      group('MAP team reports', MAP_DATA.sources) +
      group('International rulings', RULINGS_DATA.sources);

    var btn = document.getElementById('srcBtn'), panel = document.getElementById('srcPanel'), menu = document.getElementById('srcMenu');
    function setOpen(open) { panel.hidden = !open; btn.setAttribute('aria-expanded', String(open)); }
    btn.addEventListener('click', function (e) { e.stopPropagation(); setOpen(panel.hidden); });
    document.addEventListener('click', function (e) { if (!panel.hidden && !menu.contains(e.target)) setOpen(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !panel.hidden) { setOpen(false); btn.focus(); } });
  })();

  // ---- Scroll progress bar ----
  window.addEventListener('scroll', function () {
    var h = document.documentElement;
    var st = h.scrollTop || document.body.scrollTop;
    var sh = h.scrollHeight - h.clientHeight;
    document.getElementById('scrollProgress').style.width = (sh > 0 ? (st / sh * 100) : 0) + '%';
  });

  // ---- The four tabs of the merged page (no area switch) ----
  var TABS = [
    { id: 'overview', label: 'Overview' },
    { id: 'timing',   label: 'Timing & resolution' },
    { id: 'advance',  label: 'Advance pricing' },
    { id: 'cases',    label: 'APA case studies' }
  ];

  var active = TABS[0].id;

  // ===========================================================
  //  Shared chart toolkit (hand-built inline SVG, brand tokens)
  // ===========================================================
  var D = MAP_DATA;

  // ===========================================================
  //  Unified instrument taxonomy + by-type accessor (additive)
  //  Source-of-truth routing per the spec v2 section:
  //    MAP        = MAP report, aggregate of INT+TP+TB+ML (pure dispute count)
  //    BAPA, MAPA = MAP report (single source of truth)
  //    ATR, APA, INNO, OTHER = international-rulings report
  // ===========================================================
  var MAP_DISPUTE_STREAMS = ['INT', 'TP', 'TB', 'MLMAP']; // MAP aggregate (excl. BAPA/MAPA)
  var WS_LABEL = { INT: 'Interpretation', TP: 'Transfer pricing', TB: 'Tie-breaker', MLMAP: 'Multilateral' };
  var TYPES = [
    { key: 'MAP',   label: 'MAP (dispute)',     short: 'MAP',   c: 'var(--ct-500)', glossKey: 'MAP',   src: 'map'     },
    { key: 'ATR',   label: 'ATR',               short: 'ATR',   c: 'var(--ct-300)', glossKey: 'ATR',   src: 'rulings' },
    { key: 'APA',   label: 'APA (unilateral)',  short: 'APA',   c: 'var(--brand-green-600)', glossKey: 'APA',  src: 'rulings' },
    { key: 'BAPA',  label: 'BAPA',              short: 'BAPA',  c: 'var(--brand-green-400)', glossKey: 'BAPA',  src: 'map'     },
    { key: 'MAPA',  label: 'MAPA',              short: 'MAPA',  c: 'var(--accent-terra)',    glossKey: 'MAPA',  src: 'map'     },
    { key: 'INNO',  label: 'Innovation box',    short: 'Innovation box', c: 'var(--accent-ochre)', glossKey: 'Innovatiebox', src: 'rulings' },
    { key: 'OTHER', label: 'Other rulings',     short: 'Other', c: 'var(--ct-grey)',     glossKey: 'Overige', src: 'rulings' }
  ];
  function typeOf(key) {
    for (var i = 0; i < TYPES.length; i++) if (TYPES[i].key === key) return TYPES[i];
    return null;
  }
  // Maps a unified TYPES key to its RULINGS_DATA.flow key (where applicable).
  var RULING_KEY_OF = { ATR: 'ATR', APA: 'APA', INNO: 'Innovatiebox', OTHER: 'Overige' };

  // typeStats(typeKey, year) -> {begin, received, closed, end} from the correct source.
  // Inventory exists for 2023/2024/2025 only (fine for the by-type snapshot).
  function typeStats(typeKey, year) {
    if (typeKey === 'MAP') {
      var inv = MAP_DATA.inventory[year];
      if (!inv) return null;
      var acc = { begin: 0, received: 0, closed: 0, end: 0 };
      MAP_DISPUTE_STREAMS.forEach(function (s) {
        acc.begin += inv[s].begin; acc.received += inv[s].received;
        acc.closed += inv[s].closed; acc.end += inv[s].end;
      });
      return acc;
    }
    if (typeKey === 'BAPA' || typeKey === 'MAPA') {
      var i = MAP_DATA.inventory[year];
      return i ? { begin: i[typeKey].begin, received: i[typeKey].received, closed: i[typeKey].closed, end: i[typeKey].end } : null;
    }
    var rk = RULING_KEY_OF[typeKey];
    var f = rk && RULINGS_DATA.flow[year] ? RULINGS_DATA.flow[year][rk] : null;
    return f ? { begin: f.begin, received: f.received, closed: f.closed, end: f.end } : null;
  }

  // Multi-year received/closed series for a unified type, aligned to MAP_DATA.years
  // (2019–2025). Rulings types only exist 2023–2025, so earlier years are null
  // (the line is only plotted for years that exist).
  function typeSeries(typeKey, metric) {
    var t = typeOf(typeKey);
    return MAP_DATA.years.map(function (yr, i) {
      if (t.src === 'map') {
        if (typeKey === 'MAP') {
          return MAP_DISPUTE_STREAMS.reduce(function (a, s) { return a + MAP_DATA.caseload[s][metric][i]; }, 0);
        }
        return MAP_DATA.caseload[typeKey][metric][i]; // BAPA / MAPA span the full axis
      }
      var rk = RULING_KEY_OF[typeKey];
      return (RULINGS_DATA.flow[yr] && RULINGS_DATA.flow[yr][rk]) ? RULINGS_DATA.flow[yr][rk][metric] : null;
    });
  }

  // The BAPA/MAPA source-of-truth footnote (must appear where their volumes show).
  var SOT_FOOTNOTE = 'BAPA/MAPA volumes use the MAP team’s figures; the international-rulings report reports slightly different numbers (different team, cut-off and counting).';

  // ---- Glossary: plain-English definitions for technical terms ----
  var GLOSSARY = {
    MAP:   "Mutual Agreement Procedure — the tax-treaty mechanism where two countries' competent authorities work together to resolve double taxation or taxation contrary to the treaty.",
    INT:   "Interpretation cases — how a tax treaty applies, e.g. cross-border employment and pensions, or withholding tax on dividends, interest and royalties, and permanent-establishment questions.",
    TP:    "Transfer pricing — the arm's-length pricing of transactions between group companies, and the allocation of profit to permanent establishments.",
    TB:    "Corporate tie-breaker — deciding a company's treaty residence when two countries both treat it as resident.",
    MLMAP: "Multilateral MAP — a transfer-pricing case involving more than two countries at the same time.",
    APA:   "Advance Pricing Agreement — upfront certainty on the transfer pricing of intra-group transactions, agreed with the tax authority.",
    BAPA:  "Bilateral (or multilateral) Advance Pricing Agreement — transfer-pricing certainty agreed in advance with one or more treaty-partner countries.",
    MAPA:  "Multilateral Advance Pricing Agreement — an APA agreed with two or more treaty partners together.",
    ATR:   "Advance Tax Ruling — upfront certainty on the tax consequences of a structure, e.g. the participation exemption or the dividend-withholding exemption.",
    Innovatiebox: "Innovation box — a reduced effective corporate-tax rate on profits from qualifying self-developed intangible assets.",
    Overige: "Other international rulings, outside the ATR, APA/BAPA and innovation-box categories.",
    BEPS:  "BEPS Action 14 — the OECD minimum standard under which countries aim to resolve MAP cases within an average of 24 months.",
    GROSS: "Gross processing time, from the formal request to agreement (or withdrawal/rejection), including time spent waiting for requested information. The pre-filing (vooroverleg) stage is not counted.",
    WORKSTREAM: "Workstream — the category of case: interpretation, transfer pricing, multilateral, or corporate tie-breaker.",
    OECD:  "OECD — the Organisation for Economic Co-operation and Development, which sets the MAP statistics framework and the BEPS minimum standards.",
    TNMM:  "Transactional Net Margin Method — a transfer-pricing method that benchmarks a tested party's net profit margin against comparable independent companies."
  };
  function escAttr(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  // Styled hover-definition span (for non-interactive text: legends, prose, headers).
  function gloss(text, key) {
    var d = GLOSSARY[key];
    return d ? '<span class="gloss" tabindex="0" data-def="' + escAttr(d) + '">' + text + '</span>' : text;
  }
  // Native title attribute (for interactive elements like chips, to avoid nested focus).
  function titleAttr(key) {
    var d = GLOSSARY[key];
    return d ? ' title="' + escAttr(d) + '"' : '';
  }
  // Short, English type labels for compact spots (e.g. matrix headers).
  var RTYPE_SHORT = { ATR: 'ATR', APA: 'APA', BAPA: 'BAPA', Innovatiebox: 'Innovation box', Overige: 'Other' };
  function svgEl(w, h, body, title) {
    var aria = title ? ' aria-label="' + title + '"' : '';
    var titleEl = title ? '<title>' + title + '</title>' : '';
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="chart" role="img"' + aria +
      ' preserveAspectRatio="xMidYMid meet">' + titleEl + body + '</svg>';
  }
  function linePath(pts) { // pts: [[x,y],...] -> SVG path "d"
    return pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
  }
  function yScale(plotH, padTop, max) { return function (v) { return padTop + (1 - v / max) * plotH; }; }

  // Tooltip: wire every [data-tip] inside #id to the .tooltip in its .chart-wrap.
  function wireTips(id) {
    var wrap = document.getElementById(id);
    if (!wrap) return;
    var tp = wrap.querySelector('.tooltip');
    if (!tp) return;
    wrap.querySelectorAll('[data-tip]').forEach(function (el) {
      el.addEventListener('mousemove', function (e) {
        var r = wrap.getBoundingClientRect();
        tp.innerHTML = el.getAttribute('data-tip');
        tp.style.left = (e.clientX - r.left) + 'px';
        tp.style.top = (e.clientY - r.top - 6) + 'px';
        tp.classList.add('show');
      });
      el.addEventListener('mouseleave', function () { tp.classList.remove('show'); });
    });
  }

  // Begin → received → (−closed) → end waterfall. Shared by the MAP inventory
  // view and the rulings by-type flow view (DRY). Returns the SVG markup only;
  // callers wrap it in .chart-wrap + .tooltip and add a reconciliation readout.
  function buildWaterfall(begin, received, closed, end, opts) {
    opts = opts || {};
    var steps = [
      { label: 'Begin',    v: begin,    base: 0,                kind: 'tot' },
      { label: 'Received', v: received, base: begin,            kind: 'up' },
      { label: 'Closed',   v: -closed,  base: begin + received, kind: 'down' },
      { label: 'End',      v: end,      base: 0,                kind: 'tot' }
    ];
    var W = opts.W || 720, H = opts.H || 340, padL = 44, padB = 28, padTop = 22;
    var plotW = W - padL - 16, plotH = H - padB - padTop;
    var max = niceMax(begin + received);
    var ys = yScale(plotH, padTop, max);
    var grid = [0, 0.25, 0.5, 0.75, 1].map(function (f) {
      var y = padTop + f * plotH, v = Math.round(max * (1 - f));
      return '<line x1="' + padL + '" y1="' + y + '" x2="' + (padL + plotW) + '" y2="' + y + '" class="grid"/>' +
        '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" class="ytick">' + v + '</text>';
    }).join('');
    var bw = plotW / steps.length * 0.5;
    var slot = function (i) { return padL + (i + 0.25) * (plotW / steps.length); };
    // Running level each bar leaves behind: totals settle at their own value,
    // up/down deltas leave the cumulative running total (base + delta).
    var levelAfter = steps.map(function (s) {
      return s.kind === 'tot' ? s.v : s.base + s.v;
    });
    var connectors = steps.slice(1).map(function (s, j) {
      var i = j + 1;                       // current bar index (1..3)
      var y = ys(levelAfter[i - 1]);       // level the previous bar left
      return '<line x1="' + (slot(i - 1) + bw).toFixed(1) + '" y1="' + y.toFixed(1) +
        '" x2="' + slot(i).toFixed(1) + '" y2="' + y.toFixed(1) +
        '" stroke="var(--border-default)" stroke-width="1" stroke-dasharray="3 3"/>';
    }).join('');
    var bars = steps.map(function (s, i) {
      var x = slot(i);
      var top = s.kind === 'down' ? ys(s.base) : ys(s.base + Math.max(s.v, 0));
      var bot = s.kind === 'down' ? ys(s.base + s.v) : ys(s.base);
      var fill = s.kind === 'tot' ? 'var(--ct-500)' : s.kind === 'up' ? 'var(--brand-green-500)' : 'var(--danger)';
      var y0 = Math.min(top, bot), hgt = Math.abs(bot - top);
      var sign = s.kind === 'up' ? '+' : s.kind === 'down' ? '−' : '';
      return '<rect class="hit" x="' + x.toFixed(1) + '" y="' + y0.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hgt.toFixed(1) +
        '" rx="3" fill="' + fill + '" data-tip="<b>' + s.label + '</b><br>' + sign + Math.abs(s.v) + '"/>' +
        '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 8) + '" class="xtick">' + s.label + '</text>' +
        '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (y0 - 6).toFixed(1) + '" class="barval">' + sign + Math.abs(s.v) + '</text>';
    }).join('');
    return svgEl(W, H, grid + connectors + bars, opts.title || 'Begin plus received minus closed equals end');
  }

  // ===========================================================
  //  Per-tab control state
  // ===========================================================
  var R = RULINGS_DATA;
  // Overview tab
  var ovYear = 2025;                                 // by-type snapshot year (2023–2025)
  var ovTrendMetric = 'received';                    // 'received' | 'closed'
  var ovOn = { MAP: true, ATR: true, APA: true, BAPA: true, MAPA: true, INNO: true, OTHER: true };
  // Timing tab
  var outYear = 2025;                                // MAP outcome-breakdown year (2024/2025)
  var monthsYear = 2025;                             // "typical months by instrument": year or 'avg'
  var partnerYear = 2025;                            // top treaty partners year (2024/2025)
  // Advance-pricing tab
  var apType = 'APA';                                // 'APA' | 'BAPA' | 'MAPA'
  var apCmpYear = 2025;                              // side-by-side comparison year (2023–2025)

  // ===========================================================
  //  Shared by-type builders (reuse the svgEl/linePath/yScale toolkit)
  // ===========================================================

  // Unified multi-type trend over MAP_DATA.years (2019–2025). MAP/BAPA/MAPA span
  // the full axis; ATR/APA/INNO/OTHER only have points 2023–2025 (their line
  // starts mid-axis — only plot points/segments for years that exist).
  function unifiedTrendChart(metric, onKeys) {
    var W = 900, H = 360, padL = 48, padTop = 16, padB = 28;
    var plotW = W - padL - 16, plotH = H - padTop - padB;
    var keys = onKeys.length ? onKeys : ['MAP'];
    var vals = [1];
    keys.forEach(function (k) {
      typeSeries(k, metric).forEach(function (v) { if (v != null) vals.push(v); });
    });
    var max = niceMax(Math.max.apply(null, vals));
    var ys = yScale(plotH, padTop, max);
    var xs = function (i) { return padL + (i / (MAP_DATA.years.length - 1)) * plotW; };
    var grid = [0, 0.25, 0.5, 0.75, 1].map(function (f) {
      var y = padTop + f * plotH, v = Math.round(max * (1 - f));
      return '<line x1="' + padL + '" y1="' + y + '" x2="' + (padL + plotW) + '" y2="' + y + '" class="grid"/>' +
        '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" class="ytick">' + v + '</text>';
    }).join('');
    var mLabel = metric === 'received' ? 'Received' : 'Closed';
    var lines = keys.map(function (k) {
      var t = typeOf(k), ser = typeSeries(k, metric);
      var pts = [];
      ser.forEach(function (v, i) { if (v != null) pts.push([xs(i), ys(v), i]); });
      if (!pts.length) return '';
      var path = pts.length > 1 ? '<path d="' + linePath(pts.map(function (p) { return [p[0], p[1]]; })) +
        '" fill="none" stroke="' + t.c + '" stroke-width="2.5" stroke-linejoin="round"/>' : '';
      var dots = pts.map(function (p) {
        // For the aggregate MAP line, break the total down by workstream for that year.
        var extra = (k === 'MAP') ? MAP_DISPUTE_STREAMS.map(function (s) {
          return '<br>· ' + WS_LABEL[s] + ': ' + MAP_DATA.caseload[s][metric][p[2]];
        }).join('') : '';
        return '<circle class="hit" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="9" fill="transparent" ' +
          'data-tip="<b>' + t.label + ' ' + MAP_DATA.years[p[2]] + '</b><br>' + mLabel + ': ' + ser[p[2]] + extra + '"/>' +
          '<circle class="dot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="' + t.c + '"/>';
      }).join('');
      return path + dots;
    }).join('');
    var xl = MAP_DATA.years.map(function (y, i) { return '<text x="' + xs(i) + '" y="' + (H - 8) + '" class="xtick">' + y + '</text>'; }).join('');
    return svgEl(W, H, grid + lines + xl, 'Requests ' + metric + ' by instrument, 2019–2025');
  }

  // Legend for a set of unified-type keys, with the received/closed metric note.
  function typeLegend(keys, metric) {
    var items = keys.map(typeOf).filter(Boolean).map(function (t) {
      return '<span class="lg" style="color:' + t.c + '"><span class="sw"></span>' + gloss(t.label, t.glossKey) + '</span>';
    }).join('');
    var note = metric ? '<span class="lg" style="color:var(--fg-3)"><span class="sw"></span>' +
      (metric === 'received' ? 'Received' : 'Closed') + '</span>' : '';
    return '<div class="chart-legend">' + items + note + '</div>';
  }

  // Dual-metric trend: per type, received (solid) + closed (dashed) in the same
  // colour, over the 2019–2025 axis. Used by the Advance-pricing tab.
  function dualTrendChart(onKeys) {
    var W = 900, H = 360, padL = 48, padTop = 16, padB = 28;
    var plotW = W - padL - 16, plotH = H - padTop - padB;
    var keys = onKeys.length ? onKeys : ['APA'];
    var vals = [1];
    keys.forEach(function (k) {
      ['received', 'closed'].forEach(function (m) { typeSeries(k, m).forEach(function (v) { if (v != null) vals.push(v); }); });
    });
    var max = niceMax(Math.max.apply(null, vals));
    var ys = yScale(plotH, padTop, max);
    var xs = function (i) { return padL + (i / (MAP_DATA.years.length - 1)) * plotW; };
    var grid = [0, 0.25, 0.5, 0.75, 1].map(function (f) {
      var y = padTop + f * plotH, v = Math.round(max * (1 - f));
      return '<line x1="' + padL + '" y1="' + y + '" x2="' + (padL + plotW) + '" y2="' + y + '" class="grid"/>' +
        '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" class="ytick">' + v + '</text>';
    }).join('');
    function metricLines(k, metric, dashed) {
      var t = typeOf(k), ser = typeSeries(k, metric), mLabel = metric === 'received' ? 'Received' : 'Closed';
      var pts = [];
      ser.forEach(function (v, i) { if (v != null) pts.push([xs(i), ys(v), i]); });
      if (!pts.length) return '';
      var dash = dashed ? ' stroke-dasharray="4 4"' : '';
      var path = pts.length > 1 ? '<path d="' + linePath(pts.map(function (p) { return [p[0], p[1]]; })) +
        '" fill="none" stroke="' + t.c + '" stroke-width="' + (dashed ? 2 : 2.5) + '"' + dash + ' stroke-linejoin="round"/>' : '';
      var dots = pts.map(function (p) {
        return '<circle class="hit" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="9" fill="transparent" ' +
          'data-tip="<b>' + t.label + ' ' + MAP_DATA.years[p[2]] + '</b><br>' + mLabel + ': ' + ser[p[2]] + '"/>' +
          (dashed ? '' : '<circle class="dot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="' + t.c + '"/>');
      }).join('');
      return path + dots;
    }
    var lines = keys.map(function (k) { return metricLines(k, 'received', false) + metricLines(k, 'closed', true); }).join('');
    var xl = MAP_DATA.years.map(function (y, i) { return '<text x="' + xs(i) + '" y="' + (H - 8) + '" class="xtick">' + y + '</text>'; }).join('');
    return svgEl(W, H, grid + lines + xl, 'APA, BAPA and MAPA requests received (solid) and closed (dashed), 2019–2025');
  }

  // Legend for the dual-metric trend: type colours + solid=received / dashed=closed.
  function dualLegend(keys) {
    var items = keys.map(typeOf).filter(Boolean).map(function (t) {
      return '<span class="lg" style="color:' + t.c + '"><span class="sw"></span>' + gloss(t.label, t.glossKey) + '</span>';
    }).join('');
    return '<div class="chart-legend">' + items +
      '<span class="lg" style="color:var(--fg-3)"><span class="sw"></span>Received</span>' +
      '<span class="lg" style="color:var(--fg-3)"><span class="sw dashed"></span>Closed</span></div>';
  }

  // Horizontal by-type bars (received & closed) for a selected year, all 7 types.
  // Uses typeStats() so each instrument is routed to its source of truth.
  function byTypeBars(year) {
    var inv = MAP_DATA.inventory[year];
    // Rich, styled tooltip for the aggregate MAP bar: title + total + per-workstream split.
    var MAP_TIP_TITLE = { received: 'New MAP cases by type', closed: 'MAP cases closed by type' };
    function mapTip(metric) {
      if (!inv) return '';
      var total = MAP_DISPUTE_STREAMS.reduce(function (a, s) { return a + inv[s][metric]; }, 0);
      return '<b>' + MAP_TIP_TITLE[metric] + '</b> &middot; ' + total + ' total' +
        MAP_DISPUTE_STREAMS.map(function (s) { return '<br>&middot; ' + WS_LABEL[s] + ': ' + inv[s][metric]; }).join('');
    }
    var rows = TYPES.map(function (t) {
      var s = typeStats(t.key, year);
      return { t: t, received: s ? s.received : null, closed: s ? s.closed : null };
    });
    var maxV = 1;
    rows.forEach(function (r) { if (r.received != null) maxV = Math.max(maxV, r.received, r.closed); });
    function bar(t, val, metric, color) {
      var mLabel = metric === 'received' ? 'Received' : 'Closed';
      if (val == null) return '<span class="otrack" data-tip="<b>' + t.label + ' ' + year + '</b><br>no data for ' + year + '"><span class="ofill" style="width:0%;background:' + color + '"></span></span><span class="oval">—</span>';
      var tip = (t.key === 'MAP' && inv) ? mapTip(metric) : '<b>' + t.label + ' ' + year + '</b><br>' + mLabel + ': ' + val;
      return '<span class="otrack" data-tip="' + tip + '"><span class="ofill" style="width:' + (val / maxV * 100).toFixed(1) + '%;background:' + color + '"></span></span><span class="oval">' + val + '</span>';
    }
    var body = rows.map(function (r) {
      return '<div class="obar"><span class="olabel">' + gloss(r.t.label, r.t.glossKey) + '</span>' + bar(r.t, r.received, 'received', r.t.c) + '</div>';
    }).join('');
    var bodyClosed = rows.map(function (r) {
      return '<div class="obar"><span class="olabel">' + gloss(r.t.label, r.t.glossKey) + '</span>' + bar(r.t, r.closed, 'closed', 'var(--ct-grey)') + '</div>';
    }).join('');
    return '<div class="chart-wrap"><div class="outcols">' +
      '<h4>Received ' + year + '</h4>' + body +
      '<h4>Closed ' + year + '</h4>' + bodyClosed +
      '</div><div class="tooltip"></div></div>';
  }

  // MAP average cycle-time line vs the 24-month norm (carried over from the old
  // MAP timing view). Returns {svg, legend}.
  function cycleTimeChart() {
    var ct = D.cycleTimes, W = 760, H = 320, padL = 40, padTop = 16, padB = 26;
    var plotW = W - padL - 16, plotH = H - padTop - padB, max = 30;
    var ys = yScale(plotH, padTop, max);
    var xs = function (i) { return padL + (i / (ct.years.length - 1)) * plotW; };
    var grid = [0, 6, 12, 18, 24, 30].map(function (v) {
      var y = ys(v);
      return '<line x1="' + padL + '" y1="' + y + '" x2="' + (padL + plotW) + '" y2="' + y + '" class="grid"/>' +
        '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" class="ytick">' + v + '</text>';
    }).join('');
    var norm = '<line x1="' + padL + '" y1="' + ys(ct.norm) + '" x2="' + (padL + plotW) + '" y2="' + ys(ct.norm) +
      '" class="norm"/><text x="' + (padL + plotW) + '" y="' + (ys(ct.norm) - 5) + '" class="normlbl">24-mo norm</text>';
    var series = [
      ['TP', 'var(--brand-green-600)', 'Transfer pricing'],
      ['INT', 'var(--ct-500)', 'Interpretation'],
      ['Total', 'var(--ct-300)', 'All cases']
    ];
    var lines = series.map(function (s) {
      var pts = ct[s[0]].map(function (v, i) { return [xs(i), ys(v)]; });
      var dots = pts.map(function (p, i) {
        var ci = MAP_DATA.years.indexOf(ct.years[i]);
        var n = s[0] === 'Total' ? MAP_DISPUTE_STREAMS.reduce(function (a, st) { return a + MAP_DATA.caseload[st].closed[ci]; }, 0) : MAP_DATA.caseload[s[0]].closed[ci];
        var byType = s[0] === 'Total' ? '<br><b>Cases closed by type</b>' + MAP_DISPUTE_STREAMS.map(function (st) { return '<br>&middot; ' + WS_LABEL[st] + ': ' + MAP_DATA.caseload[st].closed[ci]; }).join('') : '';
        return '<circle class="hit" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="9" fill="transparent" ' +
          'data-tip="<b>' + s[2] + ' ' + ct.years[i] + '</b><br>~' + ct[s[0]][i] + ' months<br>' + n + ' cases closed' + byType + '"/>' +
          '<circle class="dot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="' + s[1] + '"/>';
      }).join('');
      return '<path d="' + linePath(pts) + '" fill="none" stroke="' + s[1] + '" stroke-width="2.5" stroke-linejoin="round"/>' + dots;
    }).join('');
    var xl = ct.years.map(function (y, i) { return '<text x="' + xs(i) + '" y="' + (H - 6) + '" class="xtick">' + y + '</text>'; }).join('');
    var legend = '<div class="chart-legend">' + series.map(function (s) {
      return '<span class="lg" style="color:' + s[1] + '"><span class="sw"></span>' + gloss(s[2], s[0]) + '</span>';
    }).join('') + '<span class="lg" style="color:var(--accent-ochre)"><span class="sw dashed"></span>' + gloss('24-mo norm', 'BEPS') + '</span></div>';
    return { svg: svgEl(W, H, grid + norm + lines + xl, 'Average MAP cycle time vs 24-month norm'), legend: legend };
  }

  // Ranked "typical months by type" horizontal bar: MAP cycle time (TP/INT/Total
  // 2025) alongside ruling gross time-to-granted (ATR/APA/BAPA/INNO/OTHER 2025).
  // Two different metrics — clearly labelled + footnoted by the caller.
  // sel: a year number, or 'avg' for the 2023–2025 average.
  function monthsByTypeBar(sel) {
    var ct = D.cycleTimes, avgYears = [2022, 2023, 2024, 2025];
    function r1(x) { return Math.round(x * 10) / 10; }
    function avg(vs) { return r1(vs.reduce(function (a, b) { return a + b; }, 0) / vs.length); }
    function mapVal(key) {
      if (sel === 'avg') return avg(avgYears.map(function (y) { return ct[key][ct.years.indexOf(y)]; }));
      var idx = ct.years.indexOf(sel); if (idx < 0) idx = ct.years.length - 1;
      return ct[key][idx];
    }
    function rulVal(type) {
      if (sel === 'avg') return avg(avgYears.map(function (y) { return R.processingTime[y][type].granted; }));
      var pg = R.processingTime[sel] || R.processingTime[2025];
      return pg[type] ? pg[type].granted : null;   // null where a year doesn't report that type (e.g. 2021 APA/BAPA)
    }
    // Case count behind each figure: MAP = cases closed (resolved) that year;
    // rulings = the (partly) granted count. null for the multi-year average.
    function mapCount(key) {
      if (sel === 'avg') return null;
      var i = MAP_DATA.years.indexOf(sel); if (i < 0) return null;
      if (key === 'Total') return MAP_DISPUTE_STREAMS.reduce(function (a, s) { return a + MAP_DATA.caseload[s].closed[i]; }, 0);
      return MAP_DATA.caseload[key].closed[i];
    }
    function rulCount(type) {
      if (sel === 'avg') return null;
      var f = R.flow[sel]; return (f && f[type]) ? f[type].outcomes.granted : null;
    }
    var rows = [
      { label: 'MAP · transfer pricing', v: mapVal('TP'),    n: mapCount('TP'),    kind: 'map', c: 'var(--brand-green-600)' },
      { label: 'MAP · interpretation',   v: mapVal('INT'),   n: mapCount('INT'),   kind: 'map', c: 'var(--ct-500)' },
      { label: 'MAP · all cases',        v: mapVal('Total'), n: mapCount('Total'), kind: 'map', c: 'var(--ct-300)' },
      { label: 'BAPA · time to granted', v: rulVal('BAPA'),  n: rulCount('BAPA'),  kind: 'ruling', c: 'var(--brand-green-400)' },
      { label: 'Innovation box · to granted', v: rulVal('Innovatiebox'), n: rulCount('Innovatiebox'), kind: 'ruling', c: 'var(--accent-ochre)' },
      { label: 'APA · time to granted',  v: rulVal('APA'),   n: rulCount('APA'),   kind: 'ruling', c: 'var(--brand-green-600)' },
      { label: 'Other · time to granted', v: rulVal('Overige'), n: rulCount('Overige'), kind: 'ruling', c: 'var(--ct-grey)' },
      { label: 'ATR · time to granted',  v: rulVal('ATR'),   n: rulCount('ATR'),   kind: 'ruling', c: 'var(--ct-300)' }
    ].filter(function (r) { return r.v != null; }).sort(function (a, b) { return b.v - a.v; });
    var maxV = 1; rows.forEach(function (r) { maxV = Math.max(maxV, r.v); });
    // For the aggregate "all cases" MAP bar, break the closed count down by workstream.
    function mapBreakdown() {
      if (sel === 'avg') return '';
      var i = MAP_DATA.years.indexOf(sel); if (i < 0) return '';
      return '<br><b>Cases closed by type</b>' + MAP_DISPUTE_STREAMS.map(function (s) {
        return '<br>&middot; ' + WS_LABEL[s] + ': ' + MAP_DATA.caseload[s].closed[i];
      }).join('');
    }
    var bars = rows.map(function (r) {
      var metricLbl = r.kind === 'map' ? 'avg cycle time' : 'gross time to granted';
      var nLbl = sel === 'avg' ? '2022–2025 average'
        : (r.n != null ? r.n + (r.kind === 'map' ? ' cases closed' : ' granted') + ' in ' + sel : '');
      var extra = (r.kind === 'map' && r.label.indexOf('all cases') >= 0) ? mapBreakdown() : '';
      var tip = '<b>' + r.label + '</b><br>' + (r.kind === 'map' ? '~' : '') + r.v + ' months &middot; ' + metricLbl + (nLbl ? '<br>' + nLbl : '') + extra;
      return '<div class="obar"><span class="olabel">' + r.label + '</span>' +
        '<span class="otrack" data-tip="' + tip + '"><span class="ofill" style="width:' + (r.v / maxV * 100).toFixed(1) + '%;background:' + r.c + '"></span></span>' +
        '<span class="oval">' + r.v + '</span></div>';
    }).join('');
    return '<div class="chart-wrap"><div class="outcols">' + bars + '</div><div class="tooltip"></div></div>';
  }

  // MAP treaty-partner horizontal bars for a given year (2024 or 2025).
  function treatyPartnerBars(year) {
    var list = D.partners[year] || D.partners[2025];
    var maxP = list[0].count;
    var bars = list.map(function (p) {
      return '<div class="pbar"><span class="plabel">' + p.name + '</span>' +
        '<span class="ptrack" data-tip="<b>' + p.name + '</b><br>' + p.count + ' MAP cases in ' + year + '"><span class="pfill" style="width:' + (p.count / maxP * 100).toFixed(1) + '%"></span></span>' +
        '<span class="pval">' + p.count + '</span></div>';
    }).join('');
    var pc = D.partners.partnerCounts[year];
    return '<div class="chart-wrap"><div class="pbars">' + bars + '</div><div class="tooltip"></div></div>' +
      '<p class="partner-foot">' + pc.total + ' treaty partners in total · ' + pc.TP + ' with transfer-pricing cases.</p>';
  }

  // MAP outcome breakdown (10 OECD categories) for a year — reuses outcomeGroups().
  function outcomesBlock(year) {
    var g = outcomeGroups(year);
    var total = g.uni.subtotal + g.bi.subtotal + g.oth.subtotal;
    var maxCount = 0;
    [g.uni, g.bi, g.oth].forEach(function (grp) { grp.items.forEach(function (o) { if (o.count > maxCount) maxCount = o.count; }); });
    function rowBars(grp, color, title) {
      var rows = grp.items.map(function (o) {
        var w = (o.count / maxCount * 100).toFixed(1);
        var pct = (o.count / total * 100).toFixed(1);
        return '<div class="obar"><span class="olabel">' + o.cat + '. ' + o.label + '</span>' +
          '<span class="otrack" data-tip="<b>' + o.cat + '. ' + o.label + '</b><br>' + o.count + ' cases &middot; ' + pct + '% of closed"><span class="ofill" style="width:' + w + '%;background:' + color + '"></span></span>' +
          '<span class="oval">' + o.count + '</span></div>';
      }).join('');
      return '<h4>' + title + ' <span class="osub">' + grp.subtotal + '</span></h4>' + rows;
    }
    var fullElim = g.bi.items.filter(function (o) { return o.cat === 4; })[0];
    var fullElimPct = fullElim ? (fullElim.count / total * 100).toFixed(1) : '0';
    var resRate = resolutionRate(year);
    var readout = '<div class="out-readout">' +
      '<div class="ror"><small>Cases closed</small><strong>' + total + '</strong></div>' +
      '<div class="ror"><small>Bilateral subtotal</small><strong>' + g.bi.subtotal + '</strong></div>' +
      '<div class="ror"><small>Full elimination</small><strong>' + (fullElim ? fullElim.count : 0) + ' · ' + fullElimPct + '%</strong></div>' +
      '<div class="ror"><small>Resolution rate</small><strong>' + (resRate == null ? '—' : resRate + '%') + '</strong></div>' +
      '</div>';
    var years = [2024, 2025].map(function (y) {
      return '<button class="chip plain' + (y === year ? ' on' : '') + '" data-outy="' + y + '">' + y + '</button>';
    }).join('');
    return '<div class="chip-row" id="outYears"><span class="chip-label">Year</span>' + years + '</div>' +
      readout +
      '<div class="chart-wrap"><div class="chart-card outcols">' +
        rowBars(g.bi, 'var(--brand-green-500)', 'Bilateral phase') +
        rowBars(g.uni, 'var(--ct-400)', 'Unilateral phase') +
        rowBars(g.oth, 'var(--ct-grey)', 'Other') +
      '</div><div class="tooltip"></div></div>';
  }

  // ===========================================================
  //  Tab 3 — Advance pricing: APA vs BAPA vs MAPA
  // ===========================================================

  // 3-type received/closed trend (APA from rulings 2023–2025; BAPA/MAPA from MAP
  // caseload 2019–2025) over the full 2019–2025 axis. Reuses unifiedTrendChart.
  function viewAdvance() {
    var s = typeStats(apType, 2025);
    var waterfall = buildWaterfall(s.begin, s.received, s.closed, s.end, {
      title: typeOf(apType).label + ' 2025 stock flow: begin plus received minus closed equals end'
    });
    var reconciles = (s.begin + s.received - s.closed) === s.end;
    // Outcome split (where available): APA from rulings; BAPA/MAPA have no
    // published outcome split in the MAP report, so we note that instead.
    var outcomeHtml = '';
    if (apType === 'APA') {
      var o = R.flow[2025].APA.outcomes;
      var outRows = [
        ['(Partly) granted',   o.granted,        'var(--brand-green-500)'],
        ['Rejected',           o.rejected,       'var(--danger)'],
        ['Withdrawn',          o.withdrawn,      'var(--accent-ochre)'],
        ['Out of treatment',   o.outOfTreatment, 'var(--ct-grey)'],
        ['No int’l character', o.noIntl,         'var(--ct-300)']
      ];
      var maxO = Math.max.apply(null, outRows.map(function (r) { return r[1]; }).concat([1]));
      var closedTotal = outRows.reduce(function (a, r) { return a + r[1]; }, 0);
      var outBars = outRows.map(function (r) {
        var pct = closedTotal ? (r[1] / closedTotal * 100).toFixed(1) : '0';
        return '<div class="obar"><span class="olabel">' + r[0] + '</span>' +
          '<span class="otrack" data-tip="<b>' + r[0] + '</b><br>' + r[1] + ' cases &middot; ' + pct + '% of closed"><span class="ofill" style="width:' + (r[1] / maxO * 100).toFixed(1) + '%;background:' + r[2] + '"></span></span>' +
          '<span class="oval">' + r[1] + '</span></div>';
      }).join('');
      outcomeHtml = '<div class="panel"><h4>APA outcome split 2025 <small>of ' + closedTotal + ' closed · rulings report</small></h4><div class="chart-wrap"><div class="outcols">' + outBars + '</div><div class="tooltip"></div></div></div>';
    } else {
      outcomeHtml = '<div class="panel"><h4>Outcome split <small>' + typeOf(apType).label + '</small></h4>' +
        '<p class="partner-foot">The MAP report — the source of truth for ' + apType + ' volumes here — does not publish a per-outcome split for ' + apType + '. ' +
        'The waterfall above tracks begin → received → closed → end. (The international-rulings report carries an outcome split for ' + apType + ', but on a different cut-off and counting.)</p></div>';
    }
    // Side-by-side comparison: the three types' received / closed / end for the
    // selected comparison year (2023–2025 — all three types have data each year).
    var cmp = ['APA', 'BAPA', 'MAPA'].map(function (k) { return { t: typeOf(k), s: typeStats(k, apCmpYear) }; });
    var cmpMax = 1; cmp.forEach(function (c) { cmpMax = Math.max(cmpMax, c.s.received, c.s.closed, c.s.end); });
    // Grouped comparison: one block per type, three bars (received/closed/end).
    var cmpBars = cmp.map(function (c) {
      function seg(val, color, lbl) {
        var tip = '<b>' + c.t.label + ' ' + apCmpYear + '</b><br>' + lbl + ': ' + val;
        return '<div class="obar"><span class="olabel" style="min-width:0">' + lbl + '</span>' +
          '<span class="otrack" data-tip="' + tip + '"><span class="ofill" style="width:' + (val / cmpMax * 100).toFixed(1) + '%;background:' + color + '"></span></span>' +
          '<span class="oval">' + val + '</span></div>';
      }
      return '<h4>' + gloss(c.t.label, c.t.glossKey) + '</h4>' +
        seg(c.s.received, 'var(--brand-green-500)', 'Received') +
        seg(c.s.closed, 'var(--danger)', 'Closed') +
        seg(c.s.end, 'var(--ct-400)', 'Year-end');
    }).join('');

    var typeChips = ['APA', 'BAPA', 'MAPA'].map(function (k) {
      var t = typeOf(k);
      return '<button class="chip' + (k === apType ? ' on' : '') + '" data-apt="' + k + '" style="--chip:' + t.c + '"' + titleAttr(t.glossKey) + '>' + t.short + '</button>';
    }).join('');
    var onKeys = ['APA', 'BAPA', 'MAPA'];
    var cmpYears = [2023, 2024, 2025].map(function (y) {
      return '<button class="chip plain' + (y === apCmpYear ? ' on' : '') + '" data-acy="' + y + '">' + y + '</button>';
    }).join('');
    var sideBySide = '<div class="chart-card">' +
      '<h4 class="stack-h">Side by side, ' + apCmpYear + ' <span class="osub">received · closed · year-end</span></h4>' +
      '<div class="chip-row" id="apCmpYears"><span class="chip-label">Year</span>' + cmpYears + '</div>' +
      '<div class="chart-wrap"><div class="outcols">' + cmpBars + '</div><div class="tooltip"></div></div>' +
      '<p class="note">' + MAP_DATA.facts.apaShareOfTP + '</p>' +
      '<p class="partner-foot">' + SOT_FOOTNOTE + '</p></div>';

    return '<div class="view-head"><h2>Advance pricing — ' + gloss('APA', 'APA') + ' vs ' + gloss('BAPA', 'BAPA') + ' vs ' + gloss('MAPA', 'MAPA') + '</h2>' +
      '<p class="lede">The three advance-pricing instruments compared head to head: unilateral ' + gloss('APA', 'APA') + 's from the ruling practice, and bilateral/multilateral ' +
      gloss('BAPA', 'BAPA') + 's and ' + gloss('MAPA', 'MAPA') + 's from the MAP team.</p></div>' +
      sideBySide +
      '<div class="chip-row" id="apTypes"><span class="chip-label">Instrument</span>' + typeChips + '</div>' +
      '<div class="panel"><h4>Stock flow 2025 <small>' + typeOf(apType).label + '</small></h4>' +
        '<div class="chart-wrap">' + waterfall + '<div class="tooltip"></div></div>' +
        '<p class="partner-foot">' + s.begin + ' + ' + s.received + ' − ' + s.closed + ' = <strong style="color:var(--fg-1)">' + s.end + '</strong>' +
        (reconciles ? '' : ' ⚠️ does not reconcile') + '</p></div>' +
      outcomeHtml +
      '<div class="chart-card">' +
        '<h4 class="stack-h">Requests over time <span class="osub">APA / BAPA / MAPA</span></h4>' +
        '<div class="chart-wrap">' + dualTrendChart(onKeys) + '<div class="tooltip"></div></div>' + dualLegend(onKeys) +
        '<p class="partner-foot">Solid = received, dashed = closed. APA from the international-rulings report (2023–2025); BAPA/MAPA from the MAP team’s caseload (2019–2025). ' + SOT_FOOTNOTE + '</p>' +
      '</div>';
  }

  // ===========================================================
  //  Rulings chart helpers reused by the tabs
  // ===========================================================

  // ---- Ruling-timing dumbbell (reused by the Timing & resolution tab) ----
  // Dumbbell: time-to-a-granted-ruling per type, 2024 dot → 2025 dot, line
  // coloured by direction (green = faster in 2025, red = slower). The 'granted'
  // outcome is the headline metric and the only one with complete 2024+2025 data.
  function rulingTimingDelta() {
    var metric = 'granted';
    var rows = R.types.map(function (t) {
      return { t: t, a: R.processingTime[2024][t][metric], b: R.processingTime[2025][t][metric] };
    }).filter(function (r) { return r.a != null && r.b != null; });
    var W = 720, rowH = 44, padTop = 14, padB = 30, padL = 150, padR = 88;
    var H = padTop + rows.length * rowH + padB;
    var plotW = W - padL - padR;
    var maxV = 1;
    rows.forEach(function (r) { maxV = Math.max(maxV, r.a, r.b); });
    var max = niceMax(maxV);
    var xs = function (v) { return padL + (v / max) * plotW; };
    var ticks = [0, 0.25, 0.5, 0.75, 1].map(function (f) {
      var v = Math.round(max * f), x = xs(v);
      return '<line x1="' + x.toFixed(1) + '" y1="' + padTop + '" x2="' + x.toFixed(1) + '" y2="' + (H - padB) + '" class="grid"/>' +
        '<text x="' + x.toFixed(1) + '" y="' + (H - padB + 16) + '" class="xtick">' + v + '</text>';
    }).join('');
    var body = rows.map(function (r, i) {
      var y = padTop + i * rowH + rowH / 2;
      var d = r.b - r.a;
      var na = (R.flow[2024] && R.flow[2024][r.t]) ? R.flow[2024][r.t].outcomes.granted : null;
      var nb = (R.flow[2025] && R.flow[2025][r.t]) ? R.flow[2025][r.t].outcomes.granted : null;
      var col = d < 0 ? 'var(--brand-green-500)' : d > 0 ? 'var(--danger)' : 'var(--ct-grey)';
      var dlabel = (d > 0 ? '+' : d < 0 ? '−' : '±') + Math.abs(d) + ' mo';
      var xa = xs(r.a), xb = xs(r.b);
      var tip = '<b>' + R.typeLabels[r.t] + '</b><br>2024: ' + r.a + ' mo' + (na != null ? ' (' + na + ' granted)' : '') + ' → 2025: ' + r.b + ' mo' + (nb != null ? ' (' + nb + ' granted)' : '') + '<br>' +
        (d === 0 ? 'no change' : (d < 0 ? Math.abs(d) + ' mo faster' : d + ' mo slower'));
      return '<text x="' + (padL - 12) + '" y="' + (y + 4).toFixed(1) + '" class="db-lbl">' + RTYPE_SHORT[r.t] + '</text>' +
        '<line x1="' + xa.toFixed(1) + '" y1="' + y.toFixed(1) + '" x2="' + xb.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="' + col + '" stroke-width="3" stroke-linecap="round"/>' +
        '<circle cx="' + xa.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="5.5" fill="var(--surface)" stroke="var(--ct-grey)" stroke-width="2"/>' +
        '<circle cx="' + xb.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="5.5" fill="var(--ct-600)"/>' +
        '<rect class="hit" x="' + padL + '" y="' + (y - rowH / 2).toFixed(1) + '" width="' + plotW + '" height="' + rowH + '" fill="transparent" data-tip="' + tip + '"/>' +
        '<text x="' + (W - padR + 10) + '" y="' + (y + 4).toFixed(1) + '" class="db-delta" fill="' + col + '">' + dlabel + '</text>';
    }).join('');
    return svgEl(W, H, ticks + body, 'Time to a granted ruling by type, 2024 versus 2025');
  }

  // ===========================================================
  //  Tab 4 — TP case studies (defining positions; unchanged content)

  function viewCases() {

            '<button class="pos-more" type="button" aria-expanded="false" hidden><span class="pos-more-lbl">Read more</span><svg class="chev" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 6 8 10 12 6"/></svg></button>' +

      '<aside class="explainer"><p class="eyebrow">inRange view · not in the data</p>' +
      '<p>' + D.facts.methodNote + ' In practice, Dutch TP MAP/APA cases most often turn on the ' + gloss('TNMM', 'TNMM') + ' and, for integrated or IP-heavy structures, the profit-split method — but the official statistics do not break this out.</p></aside>';
  }

  // ---- Render functions ----

  // The five by-type headline tiles: new requests received, FY2025 (Δ vs FY2024).
  // Non-overlapping — MAP is the pure dispute count (excludes BAPA/MAPA). Each
  // value is computed from data via typeStats(); BAPA/MAPA from the MAP report.
  function byTypeKpis() {
    return ['MAP', 'ATR', 'APA', 'BAPA', 'MAPA'].map(function (k) {
      var t = typeOf(k);
      var cur = typeStats(k, 2025), prev = typeStats(k, 2024);
      return { label: t.short, value: cur.received, delta: yoy(cur.received, prev.received), def: GLOSSARY[t.glossKey] || '' };
    });
  }

  function renderHero() {
    document.getElementById('kpis').innerHTML = byTypeKpis().map(function (t) {
      return '<div class="kf" tabindex="0"><small>' + t.label + '</small><strong>' + t.value +
        (t.delta ? ' <span class="delta">' + t.delta + '</span>' : '') + '</strong>' +
        (t.def ? '<span class="kf-tip">' + t.def + '</span>' : '') + '</div>';
    }).join('');
    document.getElementById('kpiNote').textContent = 'New requests received in FY2025 (green = change vs FY2024).';
  }

  function renderTabs() {
    document.getElementById('tabs').innerHTML = TABS.map(function (t, i) {
      return '<button class="tab-btn' + (t.id === active ? ' active' : '') +
        '" data-tab="' + t.id + '"><span class="tnum">' + (i + 1) + '</span>' + t.label + '</button>';
    }).join('');

  function renderView() {
    var views = document.getElementById('views');
    var html;
    switch (active) {
      case 'overview': html = viewOverview(); break;
      case 'timing':   html = viewTiming();   break;
      case 'advance':  html = viewAdvance();  break;
      case 'cases':    html = viewCases();    break;
      default:
        html = '<div class="view-placeholder">Unknown view.</div>';
    }
    views.innerHTML = html;

    // Re-wire tooltips: each .chart-wrap owns its own .tooltip, so wire per-wrap.
    views.querySelectorAll('.chart-wrap').forEach(function (wrap, i) {
      if (!wrap.id) wrap.id = '__cw' + i;
      wireTips(wrap.id);
    });

    // Cases view: clamp each position card to ~3 lines; reveal "Read more" only when it overflows.
    if (active === 'cases') {
      views.querySelectorAll('.position').forEach(function (art) {
        var body = art.querySelector('.pos-body'), btn = art.querySelector('.pos-more');
        if (!body || !btn) return;
        art.classList.add('is-clamped');
        if (body.scrollHeight - body.clientHeight > 2) { btn.hidden = false; }
        else { art.classList.remove('is-clamped'); }
      });
    }
  }

  // Footer: published sources from BOTH reports (labelled), both methodology
  // notes, the BAPA/MAPA source-of-truth note, and the "data through FY2025" stamp.
  function renderFooter() {
    var dlIc = '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="dl-ic"><path d="M8 2v8"/><path d="M5 7l3 3 3-3"/><path d="M3 13h10"/></svg>';
    function srcLi(s) {
      return '<li><a class="src-dl" href="' + s.file + '" download title="Download PDF">' + s.title + dlIc +
        '<span class="src-sz">' + (s.bytes / 1048576).toFixed(1) + ' MB</span></a></li>';
    }
    var mapSrc = MAP_DATA.sources.map(srcLi).join('');
    var rulSrc = RULINGS_DATA.sources.map(srcLi).join('');
    var stamp = 'Data through FY2025 · figures are the authorities’ published counts.';
    document.getElementById('footer').innerHTML =
      '<div class="footer-grid">' +
        '<div class="footer-sources">' +
          '<h4>Sources · MAP team</h4>' +
          '<ul class="srclist">' + mapSrc + '</ul>' +
          '<h4 style="margin-top:16px">Sources · International rulings (College IFZ)</h4>' +
          '<ul class="srclist">' + rulSrc + '</ul>' +
        '</div>' +
        '<div class="footer-notes">' +
          '<h4>Methodology</h4>' +
          '<p class="note">' + MAP_DATA.methodologyNote + '</p>' +
          '<p class="note">' + RULINGS_DATA.processingNote + '</p>' +
          '<p class="note">' + SOT_FOOTNOTE + '</p>' +
          '<p class="note footer-stamp">' + stamp + '</p>' +
        '</div>' +
      '</div>';
  }

  function render() { renderHero(); renderTabs(); renderView(); renderFooter(); }

  // ---- Event: tab clicks ----
  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]');
    if (!b) return;
    active = b.getAttribute('data-tab');
    render();
  });

  // ---- Event: per-tab controls (delegated once on the stable #views) ----
  document.getElementById('views').addEventListener('click', function (e) {
    var b;
    // Cases: expand/collapse a position card (no re-render — keeps other cards' state)
    if ((b = e.target.closest('.pos-more'))) {
      var pos = b.closest('.position');
      var exp = pos.classList.toggle('expanded');
      b.setAttribute('aria-expanded', exp ? 'true' : 'false');
      var lbl = b.querySelector('.pos-more-lbl');
      if (lbl) lbl.textContent = exp ? 'Show less' : 'Read more';
      return;
    }
    // Overview
    if ((b = e.target.closest('[data-ovy]')))  { ovYear = +b.getAttribute('data-ovy'); render(); return; }
    if ((b = e.target.closest('[data-ovm]')))  { ovTrendMetric = b.getAttribute('data-ovm'); render(); return; }
    if ((b = e.target.closest('[data-ovt]')))  { var k = b.getAttribute('data-ovt'); ovOn[k] = !ovOn[k]; render(); return; }
    // Timing
    if ((b = e.target.closest('[data-mty]')))  { var mv = b.getAttribute('data-mty'); monthsYear = (mv === 'avg') ? 'avg' : +mv; render(); return; }
    if ((b = e.target.closest('[data-pty]')))  { partnerYear = +b.getAttribute('data-pty'); render(); return; }
    if ((b = e.target.closest('[data-outy]'))) { outYear = +b.getAttribute('data-outy'); render(); return; }
    // Advance pricing
    if ((b = e.target.closest('[data-acy]')))  { apCmpYear = +b.getAttribute('data-acy'); render(); return; }
    if ((b = e.target.closest('[data-apt]')))  { apType = b.getAttribute('data-apt'); render(); return; }
  });

  // ---- Init ----
  render();

})();
</script>
</body>
</html>

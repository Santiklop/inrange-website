<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">

  <!-- WHITE CANVAS -->
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- TOP ACCENT BAR: brand green sliver -->
  <rect x="0" y="0" width="1200" height="6" fill="#1FA84A"/>

  <!-- inRange brand: top-left -->
  <g transform="translate(80, 80)">
    <rect x="0"  y="22" width="11" height="20" rx="2" fill="#1FA84A"/>
    <rect x="16" y="10" width="11" height="32" rx="2" fill="#1FA84A"/>
    <rect x="32" y="0"  width="11" height="42" rx="2" fill="#1FA84A"/>
    <text x="56" y="36" font-weight="800" font-size="30" fill="#0D1B2D" letter-spacing="-0.6">in<tspan fill="#1FA84A">Range</tspan></text>
  </g>

  <!-- EYEBROW: top-right -->
  <text x="1120" y="113" font-weight="700" font-size="14" fill="#0F6B2E" letter-spacing="4" text-anchor="end">OPEN PRACTICE · TP QUIZ</text>

  <!-- DIVIDER LINE under header band -->
  <line x1="80" y1="170" x2="1120" y2="170" stroke="#E1E4E9" stroke-width="1"/>

  <!-- EDITORIAL TITLE (left column) -->
  <text x="80" y="278" font-weight="800" font-size="72" fill="#0D1B2D" letter-spacing="-2">Test your TP skills.</text>

  <!-- SUBTITLE (2 lines, left column) -->
  <text x="80" y="338" font-weight="500" font-size="22" fill="#343D4C">100 case studies from the OECD TP Guidelines,</text>
  <text x="80" y="368" font-weight="500" font-size="22" fill="#343D4C">including the latest Chapter VII consultation draft.</text>

  <!-- MODE PILLS (left column) -->
  <g transform="translate(80, 440)">
    <!-- Sprint: filled green -->
    <rect x="0" y="0" width="218" height="48" rx="24" fill="#1FA84A"/>
    <text x="109" y="32" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">Sprint · 5 questions</text>

    <!-- Death Run: navy outline with skull SVG -->
    <rect x="234" y="0" width="360" height="48" rx="24" fill="#FFFFFF" stroke="#0D1B2D" stroke-width="2"/>
    <svg x="258" y="13" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0D1B2D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20"/>
      <circle cx="9" cy="12" r="1"/>
      <circle cx="15" cy="12" r="1"/>
      <path d="M8 20v2h8v-2"/>
      <path d="m12.5 17-.5-1-.5 1h1z"/>
    </svg>
    <text x="294" y="32" font-weight="700" font-size="16" fill="#0D1B2D" letter-spacing="0.3">Death Run · streak until you miss</text>
  </g>

  <!-- BOTTOM: URL -->
  <text x="80" y="580" font-weight="600" font-size="17" fill="#343D4C" letter-spacing="0.5">inrange.nl</text>

  <!-- BOTTOM-RIGHT subtle wordmark/credit -->
  <text x="1120" y="580" font-weight="500" font-size="14" fill="#7D8590" letter-spacing="2" text-anchor="end">TRANSFER PRICING · AMSTERDAM</text>

  <!-- RIGHT COLUMN: chapter case-count list (table of contents feel) -->
  <g transform="translate(740, 220)">
    <!-- Vertical divider line that anchors the right column -->
    <line x1="-32" y1="0" x2="-32" y2="270" stroke="#E1E4E9" stroke-width="1"/>

    <!-- Eyebrow -->
    <text x="0" y="0" font-weight="700" font-size="13" fill="#0F6B2E" letter-spacing="4">INSIDE THE QUIZ</text>

    <!-- Divider under eyebrow -->
    <line x1="0" y1="18" x2="380" y2="18" stroke="#E1E4E9" stroke-width="1"/>

    <!-- Chapter rows -->
    <g font-size="17" fill="#0D1B2D">
      <text x="0"   y="52" font-weight="800" letter-spacing="0.5">VI</text>
      <text x="70"  y="52" font-weight="500" fill="#343D4C">Intangibles</text>
      <text x="380" y="52" font-weight="800" text-anchor="end">32</text>

      <text x="0"   y="84" font-weight="800" letter-spacing="0.5">VII</text>
      <text x="70"  y="84" font-weight="500" fill="#343D4C">Intra-group services</text>
      <text x="380" y="84" font-weight="800" text-anchor="end">28</text>

      <text x="0"   y="116" font-weight="800" letter-spacing="0.5">IX</text>
      <text x="70"  y="116" font-weight="500" fill="#343D4C">Business restructurings</text>
      <text x="380" y="116" font-weight="800" text-anchor="end">10</text>

      <text x="0"   y="148" font-weight="800" letter-spacing="0.5">X</text>
      <text x="70"  y="148" font-weight="500" fill="#343D4C">Financial transactions</text>
      <text x="380" y="148" font-weight="800" text-anchor="end">4</text>

      <text x="0"   y="180" font-weight="800" letter-spacing="0.5">PS</text>
      <text x="70"  y="180" font-weight="500" fill="#343D4C">Profit split</text>
      <text x="380" y="180" font-weight="800" text-anchor="end">18</text>

      <text x="0"   y="212" font-weight="800" letter-spacing="0.5">+</text>
      <text x="70"  y="212" font-weight="500" fill="#343D4C">Other examples</text>
      <text x="380" y="212" font-weight="800" text-anchor="end">8</text>
    </g>

    <!-- Bottom divider before total -->
    <line x1="0" y1="232" x2="380" y2="232" stroke="#0D1B2D" stroke-width="1.5"/>

    <!-- Total -->
    <text x="0" y="262" font-weight="700" font-size="13" fill="#343D4C" letter-spacing="3">TOTAL</text>
    <text x="380" y="262" font-weight="800" font-size="20" fill="#0D1B2D" text-anchor="end">100 case studies</text>
  </g>

</svg>

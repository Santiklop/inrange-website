<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">

  <!-- WHITE CANVAS -->
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- Thin brand-green top accent -->
  <rect x="0" y="0" width="1200" height="5" fill="#1FA84A"/>

  <!-- HERO TITLE -->
  <text x="80" y="115" font-weight="800" font-size="64" fill="#0D1B2D" letter-spacing="-1.8">Ready to play?</text>

  <!-- SUBTITLE (2 lines) -->
  <text x="80" y="160" font-weight="500" font-size="22" fill="#343D4C">Test your knowledge by answering questions based on the OECD TP</text>
  <text x="80" y="190" font-weight="500" font-size="22" fill="#343D4C">Guidelines (including the latest draft Chapter VII).</text>

  <!-- "Pick a mode" line -->
  <text x="80" y="250" font-weight="500" font-size="16" fill="#7D8590">Pick a mode. Celebrate victory or suffer defeat.</text>

  <!-- SPRINT CARD (left, at rest = white) -->
  <g transform="translate(80, 280)">
    <rect width="510" height="240" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="32" y="60" font-weight="700" font-size="13" fill="#15893B" letter-spacing="3">5 QUESTIONS</text>
    <text x="32" y="110" font-weight="800" font-size="34" fill="#0D1B2D" letter-spacing="-0.5">Sprint</text>
    <text x="32" y="155" font-weight="400" font-size="17" fill="#343D4C">Five random questions drawn from across all</text>
    <text x="32" y="180" font-weight="400" font-size="17" fill="#343D4C">six chapters. Score yourself out of 5; come</text>
    <text x="32" y="205" font-weight="400" font-size="17" fill="#343D4C">back tomorrow.</text>
  </g>

  <!-- DEATH RUN CARD (right, in hover state = red + skull) -->
  <g transform="translate(610, 280)">
    <rect width="510" height="240" rx="12" fill="#B91C1C"/>
    <text x="32" y="60" font-weight="700" font-size="13" fill="#FFFFFF" letter-spacing="3">STREAK UNTIL YOU MISS</text>
    <text x="32" y="110" font-weight="800" font-size="34" fill="#FFFFFF" letter-spacing="-0.5">Death Run</text>
    <text x="32" y="155" font-weight="400" font-size="17" fill="#FFFFFF">Random questions, one at a time. The first</text>
    <text x="32" y="180" font-weight="400" font-size="17" fill="#FFFFFF">wrong answer ends the run. Share your</text>
    <text x="32" y="205" font-weight="400" font-size="17" fill="#FFFFFF">streak when you're done.</text>

    <!-- Skull SVG in top-right corner of card -->
    <svg x="412" y="20" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20"/>
      <circle cx="9" cy="12" r="1"/>
      <circle cx="15" cy="12" r="1"/>
      <path d="M8 20v2h8v-2"/>
      <path d="m12.5 17-.5-1-.5 1h1z"/>
    </svg>
  </g>

  <!-- BOTTOM: inRange brand mark + wordmark + URL -->
  <g transform="translate(80, 565)">
    <rect x="0"  y="14" width="8" height="14" rx="1.5" fill="#1FA84A"/>
    <rect x="12" y="6"  width="8" height="22" rx="1.5" fill="#1FA84A"/>
    <rect x="24" y="0"  width="8" height="28" rx="1.5" fill="#1FA84A"/>
    <text x="42" y="22" font-weight="800" font-size="18" fill="#0D1B2D" letter-spacing="-0.4">in<tspan fill="#1FA84A">Range</tspan></text>
  </g>
  <text x="1120" y="588" font-weight="500" font-size="13" fill="#7D8590" letter-spacing="2.5" text-anchor="end">OPEN PRACTICE · TP QUIZ</text>

</svg>

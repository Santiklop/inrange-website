<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <text x="80" y="142" font-weight="700" font-size="20" fill="#15893B" letter-spacing="3">OECD TP GUIDELINES · BY PARAGRAPH</text>
  <text x="80" y="224" font-weight="800" font-size="64" fill="#0D1B2D" letter-spacing="-1.8">The Guidelines,</text>
  <text x="80" y="294" font-weight="800" font-size="64" fill="#0D1B2D" letter-spacing="-1.8">word for word.</text>
  <text x="80" y="358" font-weight="500" font-size="24" fill="#343D4C">Search, follow references, copy with citation.</text>
  <g transform="translate(80, 432)">
    <rect width="300" height="52" rx="26" fill="#FFFFFF" stroke="#1FA84A" stroke-width="1.5"/>
    <circle cx="30" cy="26" r="6" fill="#1FA84A"/>
    <text x="50" y="33" font-weight="600" font-size="17" fill="#0F6B2E">2,034 numbered paragraphs</text>
    <g transform="translate(320, 0)">
      <rect width="250" height="52" rx="26" fill="#FFFFFF" stroke="#9FDFB1" stroke-width="1.5"/>
      <text x="22" y="33" font-weight="600" font-size="17" fill="#0F6B2E">2022 edition + Amount B</text>
    </g>
  </g>
  <g transform="translate(830, 118)">
    <rect x="24" y="28" width="300" height="330" rx="16" fill="#FFFFFF" stroke="#DEE2E8" stroke-width="1.5" opacity="0.6"/>
    <rect width="300" height="330" rx="16" fill="#FFFFFF" stroke="#1FA84A" stroke-width="2"/>
    <!-- card labels in a group of their own, so tools/check-og.mjs does not read the bars below as their chips -->
    <g>
      <text x="24" y="44" font-weight="700" font-size="12" fill="#15893B" letter-spacing="2">CHAPTER I</text>
      <text x="24" y="88" font-weight="800" font-size="30" fill="#0D1B2D">¶ 1.6</text>
    </g>
    <rect x="24" y="112" width="252" height="10" rx="5" fill="#E6E9EE"/>
    <rect x="24" y="134" width="236" height="10" rx="5" fill="#E6E9EE"/>
    <rect x="24" y="156" width="252" height="10" rx="5" fill="#E6E9EE"/>
    <rect x="24" y="178" width="180" height="10" rx="5" fill="#E6E9EE"/>
    <rect x="24" y="212" width="96" height="10" rx="5" fill="#9FDFB1"/>
    <rect x="128" y="212" width="120" height="10" rx="5" fill="#E6E9EE"/>
    <rect x="24" y="234" width="220" height="10" rx="5" fill="#E6E9EE"/>
    <g transform="translate(24, 266)">
      <rect width="160" height="36" rx="18" fill="#EBF8EE" stroke="#CFEFD8"/>
      <text x="80" y="23" font-weight="600" font-size="13" fill="#0F6B2E" text-anchor="middle">Copy with citation</text>
    </g>
  </g>
</svg>

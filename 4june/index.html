<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Tax Expats Club — 4 June 2026 · Check-in</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg-1); }
    body { font-family: var(--font-sans); }

    .page { max-width: 560px; margin: 0 auto; padding: 24px 16px 80px; }

    .brand { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .brand-wordmark { font-family: var(--font-display); font-weight: 800;
                      font-size: var(--text-xl); letter-spacing: -0.02em;
                      color: var(--brand-green-500); }
    .brand-tagline  { font-size: var(--text-sm); color: var(--fg-3); }
    .event-line     { font-size: var(--text-sm); color: var(--fg-2); margin-top: 6px; }

    .find-card { font-size: var(--text-lg); font-weight: 600;
                 margin: 20px 0 12px; color: var(--fg-1); }

    .search { position: sticky; top: 0; background: var(--bg);
              padding: 8px 0 12px; z-index: 10; }
    .search input { width: 100%; padding: 12px 14px; border-radius: var(--radius-md);
                    border: 1px solid var(--border-default); font-size: var(--text-base);
                    background: var(--surface-card); color: var(--fg-1); }
    .search-meta { font-size: var(--text-xs); color: var(--fg-3); margin-top: 6px; }

    .picker { display: flex; flex-direction: column; gap: 6px; list-style: none; padding: 0; margin: 0; }
    .picker li { margin: 0; }

    footer { text-align: center; padding: 24px 0;
             font-size: var(--text-xs); color: var(--fg-3); }

    .card { display: flex; align-items: center; gap: 12px; width: 100%;
            padding: 12px 14px; min-height: 64px;
            background: var(--surface-card); border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md); cursor: pointer;
            font-family: inherit; text-align: left; color: inherit; position: relative; }
    .card:active { background: var(--bg-sunken); }
    .card-avatar { width: 40px; height: 40px; border-radius: 999px;
                   display: inline-flex; align-items: center; justify-content: center;
                   color: white; font-weight: 700; font-size: 14px; letter-spacing: 0.5px; }
    .card-avatar-plus { background: var(--brand-green-100); color: var(--brand-green-700); }
    .card-body { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
    .card-name { font-weight: 700; color: var(--fg-1); font-size: 16px; }
    .card-sub  { color: var(--fg-3); font-size: 13px;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-tick { position: absolute; right: 14px; top: 14px;
                 color: var(--brand-green-500); font-weight: 800; font-size: 16px; }
  </style>
</head>
<body>
  <main class="page">
    <header class="brand">
      <div class="brand-wordmark">TAX EXPATS CLUB</div>
      <div class="brand-tagline">An informal community for tax professionals in the Netherlands</div>
      <div class="event-line">4 June 2026 · Nutanix Hoofddorp</div>
    </header>

    <div class="find-card">Find your card</div>

    <div class="search">
      <input id="search" type="search" inputmode="search"
             autocomplete="off" autocorrect="off" autocapitalize="off"
             placeholder="Search by name or company" aria-label="Search">
      <div id="search-meta" class="search-meta"></div>
    </div>

    <ul id="picker" class="picker" role="list"></ul>

    <footer>
      Powered by inRange · <a href="https://www.inrange.nl">www.inrange.nl</a>
    </footer>
  </main>

  <script type="module" src="./index.js"></script>
</body>
</html>

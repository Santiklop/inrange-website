<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">

  <!-- WHITE CANVAS -->
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- TOP ACCENT BAR: brand green sliver -->
  <rect x="0" y="0" width="1200" height="6" fill="#1FA84A"/>

  <!-- inRange brand: top-left -->
  <g transform="translate(80, 80)">
    <rect x="0"  y="22" width="11" height="20" rx="2" fill="#1FA84A"/>
    <rect x="16" y="10" width="11" height="32" rx="2" fill="#1FA84A"/>
    <rect x="32" y="0"  width="11" height="42" rx="2" fill="#1FA84A"/>
    <text x="56" y="36" font-weight="800" font-size="30" fill="#0D1B2D" letter-spacing="-0.6">in<tspan fill="#1FA84A">Range</tspan></text>
  </g>

  <!-- EYEBROW: top-right -->
  <text x="1120" y="113" font-weight="700" font-size="14" fill="#0F6B2E" letter-spacing="4" text-anchor="end">OPEN PRACTICE · TP QUIZ</text>

  <!-- DIVIDER LINE under header band -->
  <line x1="80" y1="170" x2="1120" y2="170" stroke="#E1E4E9" stroke-width="1"/>

  <!-- EDITORIAL TITLE -->
  <text x="80" y="288" font-weight="800" font-size="78" fill="#0D1B2D" letter-spacing="-2">Test your TP skills.</text>

  <!-- SUBTITLE (2 lines) -->
  <text x="80" y="350" font-weight="500" font-size="24" fill="#343D4C">100 worked examples from the OECD TP Guidelines,</text>
  <text x="80" y="384" font-weight="500" font-size="24" fill="#343D4C">including the latest Chapter VII consultation draft.</text>

  <!-- MODE LINE: two restrained pills, side by side -->
  <g transform="translate(80, 450)">
    <!-- Sprint: filled green -->
    <rect x="0" y="0" width="218" height="48" rx="24" fill="#1FA84A"/>
    <text x="109" y="32" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">Sprint · 5 questions</text>

    <!-- Death Run: navy outline -->
    <rect x="234" y="0" width="332" height="48" rx="24" fill="#FFFFFF" stroke="#0D1B2D" stroke-width="2"/>
    <text x="400" y="32" font-weight="700" font-size="16" fill="#0D1B2D" text-anchor="middle" letter-spacing="0.3">Death Run · streak until you miss</text>
  </g>

  <!-- BOTTOM: URL -->
  <text x="80" y="580" font-weight="600" font-size="17" fill="#343D4C" letter-spacing="0.5">inrange.nl</text>

  <!-- BOTTOM-RIGHT subtle wordmark/credit -->
  <text x="1120" y="580" font-weight="500" font-size="14" fill="#7D8590" letter-spacing="2" text-anchor="end">TRANSFER PRICING · AMSTERDAM</text>

</svg>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dutch MAP, APA &amp; Rulings Explorer — inRange</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='6' y='18' width='5' height='10' rx='1.2' fill='%231FA84A'/><rect x='13.5' y='13' width='5' height='15' rx='1.2' fill='%231FA84A'/><rect x='21' y='7' width='5' height='21' rx='1.2' fill='%231FA84A'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* ---- Design tokens (copied from Adyen house reference) ---- */
:root {
  --brand-green-50:#EBF8EE; --brand-green-100:#CFEFD8; --brand-green-200:#9FDFB1;
  --brand-green-300:#6CCE89; --brand-green-400:#3FBB65; --brand-green-500:#1FA84A;
  --brand-green-600:#15893B; --brand-green-700:#0F6B2E;
  --brand-navy-50:#EEF2F7; --brand-navy-100:#D6DEE9; --brand-navy-200:#ADBCCE;
  --brand-navy-300:#7E93AE; --brand-navy-400:#4F6B8A; --brand-navy-500:#2C4868;
  --brand-navy-600:#1E3551; --brand-navy-700:#14273F; --brand-navy-800:#0D1B2D;
  --neutral-0:#FFFFFF; --neutral-50:#F7F8FA; --neutral-100:#EEF0F3; --neutral-200:#DEE2E8;
  --neutral-300:#C3CAD3; --neutral-400:#9BA5B1; --neutral-500:#6E7887; --neutral-600:#4C5665;
  --neutral-700:#343D4C; --neutral-800:#1F2733;
  --accent-ochre:#C98A2B; --accent-terra:#B25838;
  --danger:#C8412F; --warning:#D89B1F;
  --bg:var(--neutral-0); --bg-muted:var(--neutral-50); --bg-sunken:var(--neutral-100);
  --surface:var(--neutral-0);
  --fg-1:var(--brand-navy-800); --fg-2:var(--neutral-700); --fg-3:var(--neutral-500);
  --fg-brand:var(--brand-green-600);
  --border-subtle:var(--neutral-200); --border-default:var(--neutral-300);
  --font-sans:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --font-serif:"Source Serif 4",ui-serif,Georgia,serif;
  --shadow-xs:0 1px 2px rgba(20,39,63,.05); --shadow-sm:0 1px 3px rgba(20,39,63,.06);
  --shadow-md:0 4px 12px -4px rgba(20,39,63,.08),0 1px 3px rgba(20,39,63,.04);
  --shadow-lg:0 16px 32px -8px rgba(20,39,63,.14),0 4px 8px rgba(20,39,63,.05);
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-xl:20px; --radius-pill:999px;
  --ease:cubic-bezier(.2,.8,.2,1); --dur-fast:140ms; --dur-base:220ms; --container:1200px;
}
[data-theme="dark"] {
  --bg:#0A1220; --bg-muted:#0D1B2D; --bg-sunken:#14273F; --surface:#0F1E32;
  --fg-1:#E7ECF3; --fg-2:#B6C2D1; --fg-3:#7E93AE; --fg-brand:var(--brand-green-400);
  --border-subtle:#1F3350; --border-default:#2C4868;
}
* { box-sizing: border-box; }
html { font-family:var(--font-sans); color:var(--fg-1); background:var(--bg); scroll-behavior:smooth; scroll-padding-top:120px; }
body { margin:0; font-size:16px; line-height:1.55; color:var(--fg-2); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; background:var(--bg); transition:background var(--dur-base) var(--ease); }
h1,h2,h3,h4,h5 { font-family:var(--font-sans); color:var(--fg-1); margin:0; letter-spacing:-.02em; }
h1 { font-size:40px; font-weight:800; line-height:1.1; letter-spacing:-.03em; }
h2 { font-size:25px; font-weight:700; line-height:1.2; }
h3 { font-size:18px; font-weight:700; line-height:1.3; }
h4 { font-size:15px; font-weight:600; }
p { margin:0 0 12px; text-wrap:pretty; }
small { font-size:12px; color:var(--fg-3); }
.eyebrow { font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--fg-brand); }
.container { max-width:var(--container); margin:0 auto; padding:0 28px; }

/* ---- Scroll progress ---- */
.scroll-progress { position:fixed; top:0; left:0; height:2px; width:0%; background:var(--brand-green-500); z-index:100; transition:width 80ms linear; }

/* ---- Site header ---- */
.site-header { position:sticky; top:0; z-index:50; background:rgba(255,255,255,.92); backdrop-filter:saturate(180%) blur(12px); -webkit-backdrop-filter:saturate(180%) blur(12px); border-bottom:1px solid var(--border-subtle); }
[data-theme="dark"] .site-header { background:rgba(10,18,32,.88); }
.header-inner { max-width:var(--container); margin:0 auto; padding:12px 28px; display:flex; align-items:center; gap:24px; }
.brand { display:flex; align-items:center; gap:10px; text-decoration:none; line-height:1; }
.brand-mark { width:26px; height:26px; flex-shrink:0; transform:translateY(-1px); }
.brand-text { font-weight:800; font-size:17px; color:var(--fg-1); letter-spacing:-.02em; }
.header-tools { display:flex; gap:6px; align-items:center; margin-left:auto; }
.icon-btn { background:transparent; border:1px solid var(--border-subtle); color:var(--fg-2); width:34px; height:34px; border-radius:var(--radius-sm); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; transition:all var(--dur-fast) var(--ease); padding:0; }
.icon-btn:hover { background:var(--bg-sunken); color:var(--fg-1); border-color:var(--border-default); }
.icon-btn svg { width:16px; height:16px; }

/* ---- Hero ---- */
.hero { padding:60px 0 30px; background:radial-gradient(900px 400px at 90% -60px,rgba(31,168,74,.07),transparent 60%),radial-gradient(700px 360px at 5% 0%,rgba(20,39,63,.04),transparent 60%); }
[data-theme="dark"] .hero { background:radial-gradient(900px 400px at 90% -60px,rgba(31,168,74,.12),transparent 60%),radial-gradient(700px 360px at 5% 0%,rgba(78,107,138,.16),transparent 60%); }
.hero .eyebrow { margin-bottom:12px; }
.hero h1 { max-width:920px; margin-bottom:16px; }
.hero .lede { font-size:18px; line-height:1.55; color:var(--fg-2); max-width:860px; margin-bottom:24px; }

/* ---- Key facts / KPI tiles ---- */
.key-facts { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; max-width:940px; }
.key-facts .kf { padding:12px 14px; border-left:2px solid var(--border-default); transition:border-left-color var(--dur-fast) var(--ease),padding var(--dur-fast) var(--ease); }
.key-facts .kf:hover { border-left-color:var(--brand-green-500); padding-left:16px; padding-right:12px; }
.key-facts .kf small { display:block; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--fg-3); margin-bottom:4px; }
.key-facts .kf strong { display:block; font-size:15px; color:var(--fg-1); font-weight:700; }
.kpi-note { font-size:12px; color:var(--fg-3); margin:12px 0 0; }
.delta { font-size:12px; font-weight:600; color:var(--brand-green-600); margin-left:4px; }
.delta:not(:empty) { background:var(--brand-green-50); padding:2px 6px; border-radius:var(--radius-pill); }
[data-theme="dark"] .delta:not(:empty) { background:rgba(31,168,74,.14); color:var(--brand-green-300); }

/* ---- Area switch (segmented control) ---- */
.area-switch { display:inline-flex; align-items:center; background:var(--bg-sunken); border:1px solid var(--border-subtle); border-radius:var(--radius-pill); padding:3px; gap:2px; margin-bottom:24px; }
.area-switch .seg { background:transparent; border:none; color:var(--fg-3); font-family:var(--font-sans); font-size:13px; font-weight:600; padding:7px 18px; border-radius:var(--radius-pill); cursor:pointer; transition:all var(--dur-fast) var(--ease); white-space:nowrap; }
.area-switch .seg:hover { color:var(--fg-1); background:var(--bg); }
.area-switch .seg.on { background:var(--brand-green-500); color:#fff; box-shadow:var(--shadow-sm); }
[data-theme="dark"] .area-switch .seg.on { background:var(--brand-green-600); }

/* ---- Tab bar ---- */
.tabbar { position:sticky; top:51px; z-index:40; background:var(--bg); border-bottom:1px solid var(--border-subtle); }
[data-theme="dark"] .tabbar { background:var(--bg); }
.tabbar-inner { max-width:var(--container); margin:0 auto; padding:0 28px; display:flex; gap:4px; overflow-x:auto; }
.tab-btn { background:transparent; border:none; border-bottom:2px solid transparent; color:var(--fg-3); padding:14px 16px; font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer; transition:color var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease); white-space:nowrap; }
.tab-btn:hover { color:var(--fg-1); }
.tab-btn.active { color:var(--brand-green-700); border-bottom-color:var(--brand-green-500); }
.tab-btn .tnum { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:50%; background:var(--bg-sunken); color:var(--fg-3); font-size:11px; margin-right:7px; }
.tab-btn.active .tnum { background:var(--brand-green-500); color:#fff; }

/* ---- Main content area ---- */
#views { padding:40px 0; min-height:400px; }

/* ---- Footer ---- */
.site-footer { margin-top:24px; padding:28px 0 48px; border-top:1px solid var(--border-subtle); color:var(--fg-3); font-size:12px; }
.site-footer h4 { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-3); margin-bottom:12px; }
.footer-grid { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:32px 48px; align-items:start; }
.footer-sources, .footer-notes { min-width:0; }
.srclist { margin:0; padding-left:18px; }
.srclist li { margin-bottom:5px; line-height:1.5; color:var(--fg-2); }
.note { font-size:12px; color:var(--fg-3); line-height:1.6; margin-bottom:10px; }
.footer-notes .note:last-child { margin-bottom:0; }
.footer-stamp { font-weight:600; color:var(--fg-2); padding-top:4px; border-top:1px solid var(--border-subtle); }

/* ---- Empty-state placeholder ---- */
.view-placeholder { padding:60px 0; text-align:center; color:var(--fg-3); font-size:14px; }

/* ============================================================
   Data-viz views (MAP & APA) — charts, chips, callouts, tiles
   ============================================================ */

/* View header */
.view-head { margin-bottom:20px; }
.view-head h2 { margin-bottom:6px; }
.view-head .lede { font-size:15px; line-height:1.5; color:var(--fg-2); max-width:780px; margin:0; }

/* Chip / toggle row */
.chip-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
.chip-row .chip-label { align-self:center; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--fg-3); margin-right:2px; }
.chip { --chip:var(--brand-navy-400); display:inline-flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--border-default); color:var(--fg-2); font-family:var(--font-sans); font-size:12.5px; font-weight:600; padding:6px 13px; border-radius:var(--radius-pill); cursor:pointer; transition:all var(--dur-fast) var(--ease); white-space:nowrap; }
.chip::before { content:""; width:9px; height:9px; border-radius:50%; background:var(--chip); opacity:.32; transition:opacity var(--dur-fast) var(--ease); flex-shrink:0; }
.chip:hover { border-color:var(--chip); color:var(--fg-1); }
.chip.on { border-color:var(--chip); color:var(--fg-1); background:color-mix(in srgb,var(--chip) 12%,var(--surface)); }
.chip.on::before { opacity:1; }
/* Plain chips (years/streams without a colour dot) */
.chip.plain::before { display:none; }
.chip.plain.on { background:var(--brand-green-500); color:#fff; border-color:var(--brand-green-500); }
[data-theme="dark"] .chip.plain.on { background:var(--brand-green-600); border-color:var(--brand-green-600); }

/* Chart card + svg */
.chart-card { background:var(--surface); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:20px 22px; margin-bottom:20px; box-shadow:var(--shadow-sm); }
.chart-wrap { position:relative; width:100%; }
.chart { display:block; width:100%; height:auto; overflow:visible; }
.chart .grid { stroke:var(--border-subtle); stroke-width:1; stroke-dasharray:2 3; }
.chart .axis { stroke:var(--border-default); stroke-width:1; }
.chart .ytick { font-size:11px; fill:var(--fg-3); font-weight:600; text-anchor:end; font-variant-numeric:tabular-nums; }
.chart .xtick { font-size:11px; fill:var(--fg-3); font-weight:600; text-anchor:middle; }
.chart .barval { font-size:11px; fill:var(--fg-1); font-weight:700; text-anchor:middle; font-variant-numeric:tabular-nums; }
.chart .dot { transition:r var(--dur-fast) var(--ease); }
.chart .hit { cursor:pointer; }
.chart .norm { stroke:var(--warning); stroke-width:1.5; stroke-dasharray:5 4; }
.chart .normlbl { font-size:10.5px; fill:var(--accent-ochre); font-weight:700; text-anchor:end; }
.chart .db-lbl { font-size:12.5px; fill:var(--fg-1); font-weight:600; text-anchor:end; }
.chart .db-delta { font-size:12px; font-weight:800; text-anchor:start; font-variant-numeric:tabular-nums; }
.chart-legend .db-sw { width:11px; height:11px; border-radius:50%; flex-shrink:0; }
.chart-legend .db-sw.open { background:var(--surface); border:2px solid var(--neutral-400); }
.chart-legend .db-sw.filled { background:currentColor; }

/* Chart legend */
.chart-legend { display:flex; gap:18px; flex-wrap:wrap; font-size:12px; color:var(--fg-3); margin-top:12px; }
.chart-legend .lg { display:inline-flex; align-items:center; gap:7px; }
.chart-legend .sw { width:16px; height:3px; border-radius:2px; background:currentColor; flex-shrink:0; }
.chart-legend .sw.dashed { background:repeating-linear-gradient(to right,currentColor 0,currentColor 4px,transparent 4px,transparent 8px); }

/* Tooltip (positioned inside .chart-wrap) */
.tooltip { position:absolute; background:var(--brand-navy-800); color:#fff; padding:8px 11px; border-radius:var(--radius-sm); font-size:12px; line-height:1.45; pointer-events:none; opacity:0; transition:opacity var(--dur-fast) var(--ease); box-shadow:var(--shadow-md); z-index:10; font-variant-numeric:tabular-nums; white-space:nowrap; transform:translate(-50%,-110%); }
.tooltip.show { opacity:1; }
.tooltip b { color:#fff; font-weight:700; }
[data-theme="dark"] .tooltip { background:var(--brand-navy-600); border:1px solid var(--border-default); }

/* ---- Glossary term (hover to define technical terms) ---- */
.gloss { border-bottom:1px dotted var(--fg-3); cursor:help; position:relative; text-decoration:none; }
.gloss:hover, .gloss:focus { color:var(--fg-1); border-bottom-color:var(--brand-green-500); outline:none; }
.gloss::after {
  content:attr(data-def); position:absolute; left:50%; bottom:calc(100% + 9px);
  transform:translateX(-50%); width:max-content; max-width:260px; white-space:normal; text-align:left;
  background:var(--brand-navy-800); color:#fff; font-family:var(--font-sans); font-weight:500;
  font-size:12px; line-height:1.45; letter-spacing:0; text-transform:none;
  padding:9px 12px; border-radius:var(--radius-sm); box-shadow:var(--shadow-lg);
  opacity:0; pointer-events:none; transition:opacity var(--dur-fast) var(--ease); z-index:60;
}
.gloss::before {
  content:""; position:absolute; left:50%; bottom:calc(100% + 4px); transform:translateX(-50%);
  border:5px solid transparent; border-top-color:var(--brand-navy-800);
  opacity:0; pointer-events:none; transition:opacity var(--dur-fast) var(--ease); z-index:60;
}
.gloss:hover::after, .gloss:focus::after, .gloss:hover::before, .gloss:focus::before { opacity:1; }
[data-theme="dark"] .gloss::after { background:var(--brand-navy-600); border:1px solid var(--border-default); }
[data-theme="dark"] .gloss::before { border-top-color:var(--brand-navy-600); }
@media print { .gloss { border-bottom:none; } .gloss::after, .gloss::before { display:none!important; } }

/* Generic panel (used by timing / TP views) */
.panel { background:var(--surface); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:20px 22px; margin-bottom:20px; box-shadow:var(--shadow-sm); }
.panel > h4 { font-size:13px; font-weight:700; color:var(--fg-1); margin-bottom:14px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.panel > h4 small { font-size:11px; font-weight:500; color:var(--fg-3); letter-spacing:0; text-transform:none; }

/* Outcomes — horizontal bars grouped by phase */
.outcols h4 { font-size:13px; font-weight:700; color:var(--fg-1); margin:18px 0 10px; display:flex; align-items:baseline; gap:8px; }
.outcols h4:first-child { margin-top:0; }
.outcols h4 .osub { font-size:12px; font-weight:700; color:var(--fg-brand); background:var(--brand-green-50); padding:1px 9px; border-radius:var(--radius-pill); font-variant-numeric:tabular-nums; }
[data-theme="dark"] .outcols h4 .osub { background:rgba(31,168,74,.16); color:var(--brand-green-300); }
.obar { display:grid; grid-template-columns:minmax(180px,260px) 1fr 44px; align-items:center; gap:12px; padding:4px 0; }
.olabel { font-size:13px; color:var(--fg-2); line-height:1.35; }
.otrack { position:relative; height:18px; background:var(--bg-sunken); border-radius:var(--radius-sm); overflow:hidden; }
.ofill { display:block; height:100%; border-radius:var(--radius-sm); min-width:2px; transition:width var(--dur-base) var(--ease); }
.oval { font-size:13px; font-weight:700; color:var(--fg-1); text-align:right; font-variant-numeric:tabular-nums; }
.out-readout { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px; }
.out-readout .ror { background:var(--surface); border:1px solid var(--border-subtle); border-left:3px solid var(--brand-green-500); border-radius:var(--radius-sm); padding:10px 14px; box-shadow:var(--shadow-xs); }
.out-readout .ror small { display:block; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--fg-3); margin-bottom:3px; }
.out-readout .ror strong { font-size:18px; font-weight:800; color:var(--fg-1); font-variant-numeric:tabular-nums; }

/* Treaty-partner horizontal bars */
.pbars { display:flex; flex-direction:column; gap:9px; }
.pbar { display:grid; grid-template-columns:150px 1fr 48px; align-items:center; gap:12px; }
.plabel { font-size:13px; color:var(--fg-2); font-weight:600; }
.ptrack { position:relative; height:20px; background:var(--bg-sunken); border-radius:var(--radius-sm); overflow:hidden; }
.pfill { display:block; height:100%; background:linear-gradient(90deg,var(--brand-navy-400),var(--brand-navy-500)); border-radius:var(--radius-sm); min-width:2px; transition:width var(--dur-base) var(--ease); }
.pval { font-size:13px; font-weight:700; color:var(--fg-1); text-align:right; font-variant-numeric:tabular-nums; }
.partner-foot { font-size:12px; color:var(--fg-3); margin:12px 0 0; }

/* Takeaway callout (Source-Serif, inRange voice) */
.takeaway { background:var(--surface); border:1px solid var(--border-subtle); border-left:4px solid var(--brand-green-500); border-radius:var(--radius-md); padding:14px 18px; margin:16px 0 0; box-shadow:var(--shadow-xs); font-family:var(--font-serif); font-size:15px; line-height:1.5; color:var(--fg-1); }

/* Stat tiles (TP deep-dive) */
.statgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:20px; }
.stat { background:var(--surface); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:18px 20px; box-shadow:var(--shadow-xs); text-align:center; transition:transform var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease); }
.stat:hover { transform:translateY(-2px); border-color:var(--border-default); }
.stat strong { display:block; font-size:30px; font-weight:800; color:var(--fg-1); line-height:1.1; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.stat small { display:block; font-size:12px; color:var(--fg-3); margin-top:6px; line-height:1.4; }

/* Method explainer (clearly-labelled inRange commentary) */
.explainer { background:linear-gradient(135deg,var(--brand-navy-50) 0%,var(--surface) 70%); border:1px solid var(--border-subtle); border-left:4px solid var(--accent-ochre); border-radius:var(--radius-md); padding:18px 22px; margin:0 0 8px; box-shadow:var(--shadow-xs); }
[data-theme="dark"] .explainer { background:linear-gradient(135deg,rgba(78,107,138,.16) 0%,var(--surface) 70%); }
.explainer .eyebrow { color:var(--accent-ochre); margin-bottom:8px; }
.explainer p:not(.eyebrow) { font-family:var(--font-serif); font-size:15px; line-height:1.55; color:var(--fg-1); margin:0; }

/* ============================================================
   International Rulings views — stacked bars, heat matrix, cards
   ============================================================ */

/* Square legend swatch variant (for type/metric legends) */
.chart-legend .sw.sq { width:11px; height:11px; border-radius:3px; }

/* Stacked share bar (ruling mix by type) */
.stack-h { font-size:13px; font-weight:700; color:var(--fg-1); margin:18px 0 9px; display:flex; align-items:baseline; gap:8px; }
.stack-h:first-child { margin-top:0; }
.stack-h .osub { font-size:12px; font-weight:700; color:var(--fg-brand); background:var(--brand-green-50); padding:1px 9px; border-radius:var(--radius-pill); font-variant-numeric:tabular-nums; }
[data-theme="dark"] .stack-h .osub { background:rgba(31,168,74,.16); color:var(--brand-green-300); }
.stackbar { display:flex; width:100%; height:34px; border-radius:var(--radius-sm); overflow:hidden; background:var(--bg-sunken); margin-bottom:6px; box-shadow:inset 0 0 0 1px var(--border-subtle); }
.stackbar .seg { display:block; height:100%; min-width:2px; transition:width var(--dur-base) var(--ease),filter var(--dur-fast) var(--ease); cursor:default; }
.stackbar .seg:hover { filter:brightness(1.08) saturate(1.1); }
.stackbar .seg + .seg { box-shadow:inset 1px 0 0 rgba(255,255,255,.35); }
[data-theme="dark"] .stackbar .seg + .seg { box-shadow:inset 1px 0 0 rgba(0,0,0,.35); }

/* Processing-time heat matrix */
.heat-wrap { overflow-x:auto; }
.heat { border-collapse:separate; border-spacing:4px; width:100%; min-width:480px; font-variant-numeric:tabular-nums; }
.heat th { font-size:12px; font-weight:700; color:var(--fg-2); text-align:center; padding:6px 4px; white-space:nowrap; }
.heat th.corner { background:transparent; }
.heat td.rowlbl { font-size:13px; font-weight:600; color:var(--fg-2); text-align:left; white-space:nowrap; padding-right:10px; }
.heat td.cell { text-align:center; font-size:14px; font-weight:700; color:var(--fg-1); padding:12px 8px; border-radius:var(--radius-sm); background:color-mix(in srgb,var(--brand-navy-500) calc(var(--a,0)*100%),var(--bg-sunken)); }
.heat td.cell.hi { color:#fff; }                                   /* light theme: dark tint → white text */
.heat td.na { text-align:center; font-size:14px; font-weight:600; color:var(--fg-3); padding:12px 8px; border-radius:var(--radius-sm); background:var(--bg-sunken); }
[data-theme="dark"] .heat td.cell { background:color-mix(in srgb,var(--brand-navy-300) calc(var(--a,0)*100%),var(--bg-sunken)); color:var(--fg-1); }
[data-theme="dark"] .heat td.cell.hi { color:var(--brand-navy-800); } /* dark theme: light tint → dark text */

/* Defining-positions cards (prominent inRange commentary) */
.pos-group { font-size:13px; font-weight:700; color:var(--fg-1); margin:24px 0 12px; padding-bottom:7px; border-bottom:1px solid var(--border-subtle); }
.pos-group:first-of-type { margin-top:0; }
.positions { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; margin-bottom:8px; }
.position { background:linear-gradient(135deg,var(--brand-navy-50) 0%,var(--surface) 60%); border:1px solid var(--border-subtle); border-left:4px solid var(--brand-green-500); border-radius:var(--radius-md); padding:18px 20px; box-shadow:var(--shadow-xs); transition:transform var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease); }
.position:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); }
[data-theme="dark"] .position { background:linear-gradient(135deg,rgba(78,107,138,.14) 0%,var(--surface) 60%); }
.position .eyebrow { color:var(--brand-green-600); margin-bottom:8px; }
[data-theme="dark"] .position .eyebrow { color:var(--brand-green-400); }
.position h3 { font-size:17px; margin-bottom:8px; line-height:1.3; }
.position p:not(.eyebrow) { font-family:var(--font-serif); font-size:14.5px; line-height:1.55; color:var(--fg-1); margin:0; }

/* ---- Responsive ---- */
@media (max-width:720px) {
  h1 { font-size:28px; }
  .hero { padding:40px 0 24px; }
  .container { padding:0 18px; }
  .key-facts { grid-template-columns:1fr 1fr; }
  .tabbar-inner { padding:0 14px; }
  .area-switch { flex-wrap:wrap; border-radius:var(--radius-lg); }
  .statgrid { grid-template-columns:1fr; }
  .obar { grid-template-columns:1fr 40px; }
  .obar .otrack { grid-column:1 / -1; order:3; }
  .pbar { grid-template-columns:110px 1fr 42px; gap:8px; }
  .chart-card, .panel { padding:16px 16px; }
  .positions { grid-template-columns:1fr; }
  .stackbar { height:30px; }
  .footer-grid { grid-template-columns:1fr; gap:24px; }
}
@media (max-width:420px) {
  h1 { font-size:25px; }
  .container { padding:0 14px; }
  .key-facts { grid-template-columns:1fr; gap:10px; }
  /* Treaty-partner long labels (e.g. "United Kingdom") get more room. */
  .pbar { grid-template-columns:1fr 40px; gap:6px 10px; }
  .pbar .ptrack { grid-column:1 / -1; order:3; height:16px; }
  .chart-card, .panel { padding:14px 13px; }
  .heat { border-spacing:3px; }
  .heat td.cell, .heat td.na { padding:9px 5px; font-size:13px; }
}

/* ---- Print ----
   A tab SPA can't honestly print "all nine views" — only the active one is in
   the DOM. So we print the CURRENTLY-ACTIVE view cleanly: hide all interactive
   chrome (header/theme button, scroll bar, area switch, sub-tab bar, chips),
   keep the hero title + lede + KPIs for context, and keep the data footer.
   Charts scale via viewBox and the heat matrix is allowed to overflow naturally
   (no inner scrollbar) so nothing clips. */
@media print {
  .site-header, .scroll-progress, .tabbar, .chip-row, .area-switch { display:none!important; }
  html, body { background:#fff!important; color:#000; }
  body { font-size:11pt; }
  .hero { padding:0 0 16px; background:none; }
  .hero h1 { font-size:24pt; }
  .hero .lede { font-size:12pt; margin-bottom:16px; }
  #views { padding:16px 0 0; min-height:0; }
  .chart-card, .panel, .stat, .explainer, .takeaway, .position, .out-readout .ror, .obar, .pbar
    { break-inside:avoid; box-shadow:none; }
  .chart-card, .panel { border-color:var(--border-default); }
  /* Let the heat matrix print in full instead of clipping behind a scrollbar. */
  .heat-wrap { overflow-x:visible; }
  .heat { min-width:0; width:100%; }
  /* Force chart/cell fills to render in print (browsers strip backgrounds by default). */
  .chart, .heat td.cell, .stackbar, .stackbar .seg, .ofill, .pfill, .delta:not(:empty), .osub
    { print-color-adjust:exact; -webkit-print-color-adjust:exact; }
  .site-footer { margin-top:16px; padding-top:16px; break-inside:avoid; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="https://inrange.nl" target="_blank" rel="noopener" aria-label="inRange">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="6" y="18" width="5" height="10" rx="1.2" fill="#1FA84A"/>
        <rect x="13.5" y="13" width="5" height="15" rx="1.2" fill="#1FA84A"/>
        <rect x="21" y="7" width="5" height="21" rx="1.2" fill="#1FA84A"/>
      </svg>
      <span class="brand-text">in<span style="color:var(--fg-1)">Range</span></span>
    </a>
    <div class="header-tools">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="container">
    <p class="eyebrow">Dutch tax authority &middot; annual reports</p>
    <h1 id="heroTitle">Dutch MAP &amp; APA Explorer</h1>
    <p class="lede" id="heroLede"></p>
    <div class="area-switch" id="areaSwitch"></div>
    <div class="key-facts" id="kpis"></div>
    <p class="kpi-note" id="kpiNote"></p>
  </div>
</section>

<nav class="tabbar"><div class="tabbar-inner" id="tabs"></div></nav>
<main class="container" id="views"></main>
<footer class="site-footer container" id="footer"></footer>

<script src="core.js"></script>
<script>
(function () {
  "use strict";

  // ---- Theme toggle (copied from Adyen, with localStorage persistence) ----
  (function () {
    var saved = localStorage.getItem('ir-theme');
    if (saved) { document.documentElement.setAttribute('data-theme', saved); }
    document.getElementById('themeBtn').addEventListener('click', function () {
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      var next = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('ir-theme', next);
    });
  })();

  // ---- Scroll progress bar ----
  window.addEventListener('scroll', function () {
    var h = document.documentElement;
    var st = h.scrollTop || document.body.scrollTop;
    var sh = h.scrollHeight - h.clientHeight;
    document.getElementById('scrollProgress').style.width = (sh > 0 ? (st / sh * 100) : 0) + '%';
  });

  // ---- area registry: each area owns its KPIs builder, lede, and sub-tabs ----
  var AREAS = {
    map: {
      label: 'MAP & APA',
      title: 'Dutch MAP &amp; APA Explorer',
      lede: "The Dutch Tax Administration MAP team’s mutual-agreement and advance-pricing figures, 2019–2025.",
      tabs: [
        { id: 'caseload',  label: 'Caseload trends' },
        { id: 'inventory', label: 'Inventory flow' },
        { id: 'outcomes',  label: 'Outcomes & resolution' },
        { id: 'timing',    label: 'Timing · countries · APAs' },
        { id: 'tp',        label: 'TP deep-dive' }
      ],
      kpis: function () {
        var k = MAP_DATA.kpis[2025], p = MAP_DATA.kpis[2024];
        return [
          ['Requests received', k.received,          yoy(k.received, p.received)],
          ['Cases closed',      k.closed,             yoy(k.closed,   p.closed)],
          ['Resolution rate',   k.resolutionRate + '%', ''],
          ['Year-end inventory',k.endInventory,       ''],
          ['Full elimination',  k.fullElimPct + '%',  '']
        ];
      }
    },
    rulings: {
      label: 'International Rulings',
      title: 'Dutch International Rulings Explorer',
      lede: "The Dutch APA/ATR ruling practice (College IFZ): rulings with an international character, 2023–2025.",
      tabs: [
        { id: 'rOverview',   label: 'Overview' },
        { id: 'rFlow',       label: 'By type & flow' },
        { id: 'rTiming',     label: 'Processing times' },
        { id: 'rPositions',  label: 'Defining positions' }
      ],
      kpis: function () {
        var k = RULINGS_DATA.kpis[2025], p = RULINGS_DATA.kpis[2024];
        return [
          ['Requests received', k.received,     yoy(k.received, p.received)],
          ['Requests closed',   k.closed,       yoy(k.closed,   p.closed)],
          ['(Partly) granted',  k.granted,      yoy(k.granted,  p.granted)],
          ['Year-end inventory',k.endInventory, yoy(k.endInventory, p.endInventory)]
        ];
      }
    }
  };

  var area   = 'map';
  var active = AREAS.map.tabs[0].id;

  // ===========================================================
  //  Shared chart toolkit (hand-built inline SVG, brand tokens)
  // ===========================================================
  var D = MAP_DATA;
  var STREAMS = [
    { key: 'INT',   label: 'Interpretation',   c: 'var(--brand-navy-500)' },
    { key: 'TP',    label: 'Transfer pricing',  c: 'var(--brand-green-600)' },
    { key: 'TB',    label: 'Tie-breaker',       c: 'var(--accent-ochre)' },
    { key: 'MLMAP', label: 'Multilateral',      c: 'var(--brand-navy-300)' },
    { key: 'BAPA',  label: 'BAPA',              c: 'var(--brand-green-400)' },
    { key: 'MAPA',  label: 'MAPA',              c: 'var(--accent-terra)' }
  ];
  function streamOf(key) {
    for (var i = 0; i < STREAMS.length; i++) if (STREAMS[i].key === key) return STREAMS[i];
    return null;
  }

  // ---- Glossary: plain-English definitions for technical terms ----
  var GLOSSARY = {
    MAP:   "Mutual Agreement Procedure — the tax-treaty mechanism where two countries' competent authorities work together to resolve double taxation or taxation contrary to the treaty.",
    INT:   "Interpretation cases — how a tax treaty applies, e.g. cross-border employment and pensions, or withholding tax on dividends, interest and royalties, and permanent-establishment questions.",
    TP:    "Transfer pricing — the arm's-length pricing of transactions between group companies, and the allocation of profit to permanent establishments.",
    TB:    "Corporate tie-breaker — deciding a company's treaty residence when two countries both treat it as resident.",
    MLMAP: "Multilateral MAP — a transfer-pricing case involving more than two countries at the same time.",
    APA:   "Advance Pricing Agreement — upfront certainty on the transfer pricing of intra-group transactions, agreed with the tax authority.",
    BAPA:  "Bilateral (or multilateral) Advance Pricing Agreement — transfer-pricing certainty agreed in advance with one or more treaty-partner countries.",
    MAPA:  "Multilateral Advance Pricing Agreement — an APA agreed with two or more treaty partners together.",
    ATR:   "Advance Tax Ruling — upfront certainty on the tax consequences of a structure, e.g. the participation exemption or the dividend-withholding exemption.",
    Innovatiebox: "Innovation box — a reduced effective corporate-tax rate on profits from qualifying self-developed intangible assets.",
    Overige: "Other international rulings, outside the ATR, APA/BAPA and innovation-box categories.",
    BEPS:  "BEPS Action 14 — the OECD minimum standard under which countries aim to resolve MAP cases within an average of 24 months.",
    GROSS: "Gross processing time — from filing to agreement (or withdrawal/rejection), including time spent waiting for requested information. Net handling time is shorter.",
    WORKSTREAM: "Workstream — the category of case: interpretation, transfer pricing, multilateral, or corporate tie-breaker.",
    OECD:  "OECD — the Organisation for Economic Co-operation and Development, which sets the MAP statistics framework and the BEPS minimum standards.",
    TNMM:  "Transactional Net Margin Method — a transfer-pricing method that benchmarks a tested party's net profit margin against comparable independent companies."
  };
  function escAttr(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  // Styled hover-definition span (for non-interactive text: legends, prose, headers).
  function gloss(text, key) {
    var d = GLOSSARY[key];
    return d ? '<span class="gloss" tabindex="0" data-def="' + escAttr(d) + '">' + text + '</span>' : text;
  }
  // Native title attribute (for interactive elements like chips, to avoid nested focus).
  function titleAttr(key) {
    var d = GLOSSARY[key];
    return d ? ' title="' + escAttr(d) + '"' : '';
  }
  // Short, English type labels for compact spots (e.g. matrix headers).
  var RTYPE_SHORT = { ATR: 'ATR', APA: 'APA', BAPA: 'BAPA', Innovatiebox: 'Innovation box', Overige: 'Other' };
  function svgEl(w, h, body, title) {
    var aria = title ? ' aria-label="' + title + '"' : '';
    var titleEl = title ? '<title>' + title + '</title>' : '';
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="chart" role="img"' + aria +
      ' preserveAspectRatio="xMidYMid meet">' + titleEl + body + '</svg>';
  }
  function linePath(pts) { // pts: [[x,y],...] -> SVG path "d"
    return pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
  }
  function yScale(plotH, padTop, max) { return function (v) { return padTop + (1 - v / max) * plotH; }; }

  // Tooltip: wire every [data-tip] inside #id to the .tooltip in its .chart-wrap.
  function wireTips(id) {
    var wrap = document.getElementById(id);
    if (!wrap) return;
    var tp = wrap.querySelector('.tooltip');
    if (!tp) return;
    wrap.querySelectorAll('[data-tip]').forEach(function (el) {
      el.addEventListener('mousemove', function (e) {
        var r = wrap.getBoundingClientRect();
        tp.innerHTML = el.getAttribute('data-tip');
        tp.style.left = (e.clientX - r.left) + 'px';
        tp.style.top = (e.clientY - r.top - 6) + 'px';
        tp.classList.add('show');
      });
      el.addEventListener('mouseleave', function () { tp.classList.remove('show'); });
    });
  }

  // Multi-series line builder (received solid + closed dashed) shared by
  // Caseload and TP deep-dive. `keys` = array of stream keys to draw.
  function lineChart(keys, opts) {
    opts = opts || {};
    var W = opts.W || 900, H = opts.H || 380, padL = 48, padB = 28, padTop = 16;
    var plotW = W - padL - 16, plotH = H - padB - padTop;
    var series = keys.map(streamOf).filter(Boolean);
    var vals = [1];
    series.forEach(function (s) {
      vals = vals.concat(D.caseload[s.key].received, D.caseload[s.key].closed);
    });
    var max = niceMax(Math.max.apply(null, vals));
    var ys = yScale(plotH, padTop, max);
    var xs = function (i) { return padL + (i / (D.years.length - 1)) * plotW; };
    var grid = [0, 0.25, 0.5, 0.75, 1].map(function (f) {
      var y = padTop + f * plotH, v = Math.round(max * (1 - f));
      return '<line x1="' + padL + '" y1="' + y + '" x2="' + (padL + plotW) + '" y2="' + y + '" class="grid"/>' +
        '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" class="ytick">' + v + '</text>';
    }).join('');
    var lines = series.map(function (s) {
      var rPts = D.caseload[s.key].received.map(function (v, i) { return [xs(i), ys(v)]; });
      var cPts = D.caseload[s.key].closed.map(function (v, i) { return [xs(i), ys(v)]; });
      var rDots = rPts.map(function (p, i) {
        return '<circle class="hit" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="9" fill="transparent" ' +
          'data-tip="<b>' + s.label + ' ' + D.years[i] + '</b><br>Received: ' + D.caseload[s.key].received[i] + '"/>' +
          '<circle class="dot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="' + s.c + '"/>';
      }).join('');
      var cDots = cPts.map(function (p, i) {
        return '<circle class="hit" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="9" fill="transparent" ' +
          'data-tip="<b>' + s.label + ' ' + D.years[i] + '</b><br>Closed: ' + D.caseload[s.key].closed[i] + '"/>';
      }).join('');
      return '<path d="' + linePath(rPts) + '" fill="none" stroke="' + s.c + '" stroke-width="2.5" stroke-linejoin="round"/>' +
        '<path d="' + linePath(cPts) + '" fill="none" stroke="' + s.c + '" stroke-width="2" stroke-dasharray="4 4" stroke-linejoin="round"/>' +
        rDots + cDots;
    }).join('');
    var xlabels = D.years.map(function (y, i) {
      return '<text x="' + xs(i) + '" y="' + (H - 8) + '" class="xtick">' + y + '</text>';
    }).join('');
    return svgEl(W, H, grid + lines + xlabels, opts.title);
  }

  function legendRow(keys) {
    var items = keys.map(streamOf).filter(Boolean).map(function (s) {
      return '<span class="lg" style="color:' + s.c + '"><span class="sw"></span>' + gloss(s.label, s.key) + '</span>';
    }).join('');
    return '<div class="chart-legend">' + items +
      '<span class="lg" style="color:var(--fg-3)"><span class="sw"></span>Received</span>' +
      '<span class="lg" style="color:var(--fg-3)"><span class="sw dashed"></span>Closed</span></div>';
  }

  // Begin → received → (−closed) → end waterfall. Shared by the MAP inventory
  // view and the rulings by-type flow view (DRY). Returns the SVG markup only;
  // callers wrap it in .chart-wrap + .tooltip and add a reconciliation readout.
  function buildWaterfall(begin, received, closed, end, opts) {
    opts = opts || {};
    var steps = [
      { label: 'Begin',    v: begin,    base: 0,                kind: 'tot' },
      { label: 'Received', v: received, base: begin,            kind: 'up' },
      { label: 'Closed',   v: -closed,  base: begin + received, kind: 'down' },
      { label: 'End',      v: end,      base: 0,                kind: 'tot' }
    ];
    var W = opts.W || 720, H = opts.H || 340, padL = 44, padB = 28, padTop = 22;
    var plotW = W - padL - 16, plotH = H - padB - padTop;
    var max = niceMax(begin + received);
    var ys = yScale(plotH, padTop, max);
    var grid = [0, 0.25, 0.5, 0.75, 1].map(function (f) {
      var y = padTop + f * plotH, v = Math.round(max * (1 - f));
      return '<line x1="' + padL + '" y1="' + y + '" x2="' + (padL + plotW) + '" y2="' + y + '" class="grid"/>' +
        '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" class="ytick">' + v + '</text>';
    }).join('');
    var bw = plotW / steps.length * 0.5;
    var slot = function (i) { return padL + (i + 0.25) * (plotW / steps.length); };
    // Running level each bar leaves behind: totals settle at their own value,
    // up/down deltas leave the cumulative running total (base + delta).
    var levelAfter = steps.map(function (s) {
      return s.kind === 'tot' ? s.v : s.base + s.v;
    });
    var connectors = steps.slice(1).map(function (s, j) {
      var i = j + 1;                       // current bar index (1..3)
      var y = ys(levelAfter[i - 1]);       // level the previous bar left
      return '<line x1="' + (slot(i - 1) + bw).toFixed(1) + '" y1="' + y.toFixed(1) +
        '" x2="' + slot(i).toFixed(1) + '" y2="' + y.toFixed(1) +
        '" stroke="var(--border-default)" stroke-width="1" stroke-dasharray="3 3"/>';
    }).join('');
    var bars = steps.map(function (s, i) {
      var x = slot(i);
      var top = s.kind === 'down' ? ys(s.base) : ys(s.base + Math.max(s.v, 0));
      var bot = s.kind === 'down' ? ys(s.base + s.v) : ys(s.base);
      var fill = s.kind === 'tot' ? 'var(--brand-navy-500)' : s.kind === 'up' ? 'var(--brand-green-500)' : 'var(--danger)';
      var y0 = Math.min(top, bot), hgt = Math.abs(bot - top);
      var sign = s.kind === 'up' ? '+' : s.kind === 'down' ? '−' : '';
      return '<rect class="hit" x="' + x.toFixed(1) + '" y="' + y0.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hgt.toFixed(1) +
        '" rx="3" fill="' + fill + '" data-tip="<b>' + s.label + '</b><br>' + sign + Math.abs(s.v) + '"/>' +
        '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 8) + '" class="xtick">' + s.label + '</text>' +
        '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (y0 - 6).toFixed(1) + '" class="barval">' + sign + Math.abs(s.v) + '</text>';
    }).join('');
    return svgEl(W, H, grid + connectors + bars, opts.title || 'Begin plus received minus closed equals end');
  }

  // ===========================================================
  //  Per-view control state
  // ===========================================================
  var caseloadOn = { INT: true, TP: true, TB: false, MLMAP: false, BAPA: false, MAPA: false };
  var invYear = 2025, invStream = 'INT';
  var outYear = 2025;
  // Rulings views
  var R = RULINGS_DATA;
  var RTYPE_COLORS = {
    ATR:          'var(--brand-navy-500)',
    APA:          'var(--brand-green-600)',
    BAPA:         'var(--brand-green-400)',
    Innovatiebox: 'var(--accent-ochre)',
    Overige:      'var(--neutral-400)'
  };
  var rYear = 2025;                       // overview
  var rFlowType = 'ATR', rFlowYear = 2025; // by type & flow
  var rtYear = 2025;                      // processing times

  // ===========================================================
  //  View: Caseload trends (Task 6)
  // ===========================================================
  function viewCaseload() {
    var keys = STREAMS.filter(function (s) { return caseloadOn[s.key]; }).map(function (s) { return s.key; });
    var toggles = STREAMS.map(function (s) {
      return '<button class="chip' + (caseloadOn[s.key] ? ' on' : '') + '" data-cl="' + s.key +
        '" style="--chip:' + s.c + '" aria-pressed="' + caseloadOn[s.key] + '"' + titleAttr(s.key) + '>' + s.label + '</button>';
    }).join('');
    var chart = keys.length
      ? '<div class="chart-wrap">' + lineChart(keys, { title: 'MAP cases received vs closed by year' }) + '<div class="tooltip"></div></div>' + legendRow(keys)
      : '<p class="partner-foot">Select at least one workstream to plot.</p>';
    return '<div class="view-head"><h2>Caseload trends</h2>' +
      '<p class="lede">New ' + gloss('MAP', 'MAP') + ' requests (solid) vs. cases closed (dashed) across the four workstreams, 2019–2025.</p></div>' +
      '<div class="chip-row" id="clToggles"><span class="chip-label">' + gloss('Workstreams', 'WORKSTREAM') + '</span>' + toggles + '</div>' +
      '<div class="chart-card">' + chart + '</div>';
  }

  // ===========================================================
  //  View: Inventory flow waterfall (Task 7)
  // ===========================================================
  function viewInventory() {
    var d = D.inventory[invYear][invStream];
    var waterfall = buildWaterfall(d.begin, d.received, d.closed, d.end, {
      title: 'MAP case inventory flow: begin plus received minus closed equals end'
    });
    var years = [2023, 2024, 2025].map(function (y) {
      return '<button class="chip plain' + (y === invYear ? ' on' : '') + '" data-invy="' + y + '">' + y + '</button>';
    }).join('');
    var streams = ['INT', 'TP', 'MLMAP', 'TB', 'BAPA', 'MAPA'].map(function (k) {
      var s = streamOf(k);
      return '<button class="chip' + (k === invStream ? ' on' : '') + '" data-invs="' + k + '" style="--chip:' + s.c + '"' + titleAttr(k) + '>' + s.label + '</button>';
    }).join('');
    var reconciles = (d.begin + d.received - d.closed) === d.end;
    return '<div class="view-head"><h2>Inventory flow</h2>' +
      '<p class="lede">How the case stock moved: begin + received − closed = end.</p></div>' +
      '<div class="chip-row" id="invYears"><span class="chip-label">Year</span>' + years + '</div>' +
      '<div class="chip-row" id="invStreams"><span class="chip-label">' + gloss('Workstream', 'WORKSTREAM') + '</span>' + streams + '</div>' +
      '<div class="chart-card"><div class="chart-wrap">' + waterfall + '<div class="tooltip"></div></div>' +
      '<p class="partner-foot">' + d.begin + ' + ' + d.received + ' − ' + d.closed + ' = <strong style="color:var(--fg-1)">' + d.end + '</strong>' +
      (reconciles ? '' : ' ⚠️ does not reconcile') + '</p></div>';
  }

  // ===========================================================
  //  View: Outcomes & resolution (Task 8)
  // ===========================================================
  function viewOutcomes() {
    var g = outcomeGroups(outYear);
    var total = g.uni.subtotal + g.bi.subtotal + g.oth.subtotal;
    var maxCount = 0;
    [g.uni, g.bi, g.oth].forEach(function (grp) {
      grp.items.forEach(function (o) { if (o.count > maxCount) maxCount = o.count; });
    });
    function rowBars(grp, color, title) {
      var rows = grp.items.map(function (o) {
        var w = (o.count / maxCount * 100).toFixed(1);
        var pct = (o.count / total * 100).toFixed(1);
        return '<div class="obar"><span class="olabel">' + o.cat + '. ' + o.label + '</span>' +
          '<span class="otrack" title="' + pct + '% of closed cases"><span class="ofill" style="width:' + w + '%;background:' + color + '"></span></span>' +
          '<span class="oval">' + o.count + '</span></div>';
      }).join('');
      return '<h4>' + title + ' <span class="osub">' + grp.subtotal + '</span></h4>' + rows;
    }
    var years = [2024, 2025].map(function (y) {
      return '<button class="chip plain' + (y === outYear ? ' on' : '') + '" data-outy="' + y + '">' + y + '</button>';
    }).join('');
    var fullElim = g.bi.items.filter(function (o) { return o.cat === 4; })[0];
    var fullElimPct = fullElim ? (fullElim.count / total * 100).toFixed(1) : '0';
    var resRate = resolutionRate(outYear);
    var readout = '<div class="out-readout">' +
      '<div class="ror"><small>Cases closed</small><strong>' + total + '</strong></div>' +
      '<div class="ror"><small>Bilateral subtotal</small><strong>' + g.bi.subtotal + '</strong></div>' +
      '<div class="ror"><small>Full elimination</small><strong>' + (fullElim ? fullElim.count : 0) + ' · ' + fullElimPct + '%</strong></div>' +
      '<div class="ror"><small>Resolution rate</small><strong>' + (resRate == null ? '—' : resRate + '%') + '</strong></div>' +
      '</div>';
    return '<div class="view-head"><h2>Outcomes &amp; resolution</h2>' +
      '<p class="lede">The ten ' + gloss('OECD', 'OECD') + ' outcome categories for ' + gloss('MAP', 'MAP') + ' cases the Dutch authority closed in ' + outYear + '. Bar width is share of all closed cases.</p></div>' +
      '<div class="chip-row" id="outYears"><span class="chip-label">Year</span>' + years + '</div>' +
      readout +
      '<div class="chart-card outcols">' +
        rowBars(g.bi, 'var(--brand-green-500)', 'Bilateral phase') +
        rowBars(g.uni, 'var(--brand-navy-400)', 'Unilateral phase') +
        rowBars(g.oth, 'var(--neutral-400)', 'Other') +
      '</div>';
  }

  // ===========================================================
  //  View: Timing · countries · APAs (Task 9)
  // ===========================================================
  function viewTiming() {
    var ct = D.cycleTimes, W = 760, H = 320, padL = 40, padTop = 16, padB = 26;
    var plotW = W - padL - 16, plotH = H - padTop - padB, max = 30;
    var ys = yScale(plotH, padTop, max);
    var xs = function (i) { return padL + (i / (ct.years.length - 1)) * plotW; };
    var grid = [0, 6, 12, 18, 24, 30].map(function (v) {
      var y = ys(v);
      return '<line x1="' + padL + '" y1="' + y + '" x2="' + (padL + plotW) + '" y2="' + y + '" class="grid"/>' +
        '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" class="ytick">' + v + '</text>';
    }).join('');
    var norm = '<line x1="' + padL + '" y1="' + ys(ct.norm) + '" x2="' + (padL + plotW) + '" y2="' + ys(ct.norm) +
      '" class="norm"/><text x="' + (padL + plotW) + '" y="' + (ys(ct.norm) - 5) + '" class="normlbl">24-mo norm</text>';
    var series = [
      ['TP', 'var(--brand-green-600)', 'Transfer pricing'],
      ['INT', 'var(--brand-navy-500)', 'Interpretation'],
      ['Total', 'var(--brand-navy-300)', 'All cases']
    ];
    var lines = series.map(function (s) {
      var pts = ct[s[0]].map(function (v, i) { return [xs(i), ys(v)]; });
      var dots = pts.map(function (p, i) {
        return '<circle class="hit" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="9" fill="transparent" ' +
          'data-tip="<b>' + s[2] + ' ' + ct.years[i] + '</b><br>~' + ct[s[0]][i] + ' months"/>' +
          '<circle class="dot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="' + s[1] + '"/>';
      }).join('');
      return '<path d="' + linePath(pts) + '" fill="none" stroke="' + s[1] + '" stroke-width="2.5" stroke-linejoin="round"/>' + dots;
    }).join('');
    var xl = ct.years.map(function (y, i) { return '<text x="' + xs(i) + '" y="' + (H - 6) + '" class="xtick">' + y + '</text>'; }).join('');
    var legend = '<div class="chart-legend">' + series.map(function (s) {
      return '<span class="lg" style="color:' + s[1] + '"><span class="sw"></span>' + gloss(s[2], s[0]) + '</span>';
    }).join('') + '<span class="lg" style="color:var(--accent-ochre)"><span class="sw dashed"></span>' + gloss('24-mo norm', 'BEPS') + '</span></div>';

    var maxP = D.partners[2025][0].count;
    var partnerBars = D.partners[2025].map(function (p) {
      return '<div class="pbar"><span class="plabel">' + p.name + '</span>' +
        '<span class="ptrack"><span class="pfill" style="width:' + (p.count / maxP * 100).toFixed(1) + '%"></span></span>' +
        '<span class="pval">' + p.count + '</span></div>';
    }).join('');
    var pc = D.partners.partnerCounts;

    var takeaway = '<aside class="takeaway">Transfer-pricing cases are the only stream that runs past the 24-month ' +
      'norm — which is part of why advance certainty (a BAPA/MAPA) is increasingly preferred over after-the-fact MAP.</aside>';

    return '<div class="view-head"><h2>Timing · countries · APAs</h2>' +
      '<p class="lede">How long cases take, who the Netherlands resolves them with, and why advance pricing agreements matter.</p></div>' +
      '<p class="note" style="margin-bottom:16px">' + D.facts.awards + '</p>' +
      '<div class="panel"><h4>Average cycle time (months) <small>approximate, read from the report chart (±~0.5 mo)</small></h4>' +
      '<div class="chart-wrap">' + svgEl(W, H, grid + norm + lines + xl, 'Average MAP cycle time vs 24-month norm') + '<div class="tooltip"></div></div>' + legend + takeaway + '</div>' +
      '<div class="panel"><h4>Top treaty partners, 2025 <small>cases per partner; named top-5 + Other</small></h4>' +
      '<div class="pbars">' + partnerBars + '</div>' +
      '<p class="partner-foot">' + pc.total + ' treaty partners in total · ' + pc.TP + ' with transfer-pricing cases.</p></div>' +
      '<div class="panel"><h4>Dispute prevention — BAPA &amp; MAPA <small>requests received vs. closed, 2019–2025</small></h4>' +
      '<div class="chart-wrap">' + lineChart(['BAPA','MAPA'], { H: 300, title: 'BAPA and MAPA requests over time' }) + '<div class="tooltip"></div></div>' + legendRow(['BAPA','MAPA']) + '</div>';
  }

  // ===========================================================
  //  View: TP deep-dive + method explainer (Task 10)
  // ===========================================================
  function viewTp() {
    var pc = D.partners.partnerCounts;
    return '<div class="view-head"><h2>Transfer pricing — deep dive</h2>' +
      '<p class="lede">The transfer-pricing workstream on its own: volumes, timing, and how much of it is now advance pricing.</p></div>' +
      '<div class="panel"><h4>TP cases received vs. closed <small>2019–2025</small></h4>' +
      '<div class="chart-wrap">' + lineChart(['TP'], { H: 320, title: 'Transfer-pricing MAP cases received vs closed' }) + '<div class="tooltip"></div></div>' + legendRow(['TP']) + '</div>' +
      '<div class="statgrid">' +
        '<div class="stat"><strong>' + pc.TP + '</strong><small>treaty partners with ' + gloss('TP', 'TP') + ' cases</small></div>' +
        '<div class="stat"><strong>~half</strong><small>' + D.facts.apaShareOfTP + '</small></div>' +
        '<div class="stat"><strong>&gt;24 mo</strong><small>only stream over the ' + gloss('BEPS Action 14', 'BEPS') + ' norm</small></div>' +
      '</div>' +
      '<aside class="explainer"><p class="eyebrow">inRange view · not in the data</p>' +
      '<p>' + D.facts.methodNote + ' In practice, Dutch TP MAP/APA cases most often turn on the ' + gloss('TNMM', 'TNMM') + ' and, for ' +
      'integrated or IP-heavy structures, the profit-split method — but the official statistics do not break this out.</p></aside>';
  }

  // ===========================================================
  //  Rulings helpers + views (Tasks 13-15)
  // ===========================================================

  // Horizontal stacked bar of a rulingMix() result (segments by type, % width).
  function stackedBar(rows) {
    return '<div class="stackbar">' + rows.map(function (r) {
      return '<span class="seg" style="width:' + r.pct + '%;background:' + RTYPE_COLORS[r.type] + '" ' +
        'data-tip="<b>' + R.typeLabels[r.type] + '</b><br>' + r.value + ' · ' + r.pct + '%"></span>';
    }).join('') + '</div>';
  }

  function rTypeLegend() {
    return '<div class="chart-legend">' + R.types.map(function (t) {
      return '<span class="lg" style="color:' + RTYPE_COLORS[t] + '"><span class="sw sq"></span>' + gloss(R.typeLabels[t], t) + '</span>';
    }).join('') + '</div>';
  }

  // Overview trend: one line per ruling type over R.years, for a chosen metric.
  var rTrendMetric = 'received'; // 'received' | 'closed'
  function rulingTrendChart(metric) {
    var W = 720, H = 320, padL = 44, padTop = 16, padB = 26;
    var plotW = W - padL - 16, plotH = H - padTop - padB;
    var vals = [1];
    R.types.forEach(function (t) { R.years.forEach(function (y) { vals.push(R.flow[y][t][metric]); }); });
    var max = niceMax(Math.max.apply(null, vals));
    var ys = yScale(plotH, padTop, max);
    var xs = function (i) { return R.years.length === 1 ? padL + plotW / 2 : padL + (i / (R.years.length - 1)) * plotW; };
    var grid = [0, 0.25, 0.5, 0.75, 1].map(function (f) {
      var y = padTop + f * plotH, v = Math.round(max * (1 - f));
      return '<line x1="' + padL + '" y1="' + y + '" x2="' + (padL + plotW) + '" y2="' + y + '" class="grid"/>' +
        '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" class="ytick">' + v + '</text>';
    }).join('');
    var mLabel = metric.charAt(0).toUpperCase() + metric.slice(1);
    var lines = R.types.map(function (t) {
      var pts = R.years.map(function (y, i) { return [xs(i), ys(R.flow[y][t][metric])]; });
      var dots = pts.map(function (p, i) {
        return '<circle class="hit" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="9" fill="transparent" ' +
          'data-tip="<b>' + R.typeLabels[t] + ' ' + R.years[i] + '</b><br>' + mLabel + ': ' + R.flow[R.years[i]][t][metric] + '"/>' +
          '<circle class="dot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="' + RTYPE_COLORS[t] + '"/>';
      }).join('');
      return '<path d="' + linePath(pts) + '" fill="none" stroke="' + RTYPE_COLORS[t] + '" stroke-width="2.5" stroke-linejoin="round"/>' + dots;
    }).join('');
    var xl = R.years.map(function (y, i) { return '<text x="' + xs(i) + '" y="' + (H - 6) + '" class="xtick">' + y + '</text>'; }).join('');
    return svgEl(W, H, grid + lines + xl, 'International rulings ' + metric + ' by type, 2023–2025');
  }

  // ---- View: Rulings overview (Task 13) ----
  function viewROverview() {
    var rec = rulingMix(rYear, 'received'), cl = rulingMix(rYear, 'closed');
    var sum = function (rows) { return rows.reduce(function (a, r) { return a + r.value; }, 0); };
    var years = R.years.map(function (y) {
      return '<button class="chip plain' + (y === rYear ? ' on' : '') + '" data-ry="' + y + '">' + y + '</button>';
    }).join('');
    return '<div class="view-head"><h2>Rulings overview</h2>' +
      '<p class="lede">International rulings issued by the APA/ATR practice, split by type.</p></div>' +
      '<div class="chip-row" id="rYears"><span class="chip-label">Year</span>' + years + '</div>' +
      '<div class="chart-card"><div class="chart-wrap">' +
        '<h4 class="stack-h">Received ' + rYear + ' <span class="osub">' + sum(rec) + '</span></h4>' + stackedBar(rec) +
        '<h4 class="stack-h">Closed ' + rYear + ' <span class="osub">' + sum(cl) + '</span></h4>' + stackedBar(cl) +
        rTypeLegend() +
      '<div class="tooltip"></div></div></div>' +
      '<div class="chart-card">' +
        '<h4 class="stack-h">' + (rTrendMetric === 'received' ? 'Received' : 'Closed') + ' over time, by type <span class="osub">2023–2025</span></h4>' +
        '<div class="chip-row" id="rTrendToggle"><span class="chip-label">Metric</span>' +
          ['received', 'closed'].map(function (m) {
            return '<button class="chip plain' + (m === rTrendMetric ? ' on' : '') + '" data-rtm="' + m + '">' + (m === 'received' ? 'Received' : 'Closed') + '</button>';
          }).join('') +
        '</div>' +
        '<div class="chart-wrap">' + rulingTrendChart(rTrendMetric) + '<div class="tooltip"></div></div>' + rTypeLegend() +
      '</div>';
  }

  // Mini multi-line trend (received / closed / end) over R.years for one type.
  function buildTypeTrend(type) {
    var W = 620, H = 260, padL = 40, padTop = 16, padB = 26;
    var plotW = W - padL - 16, plotH = H - padTop - padB;
    var metrics = [
      ['received', 'Received', 'var(--brand-green-600)'],
      ['closed',   'Closed',   'var(--danger)'],
      ['end',      'Year-end', 'var(--brand-navy-400)']
    ];
    var vals = [1];
    metrics.forEach(function (m) {
      R.years.forEach(function (y) { vals.push(R.flow[y][type][m[0]]); });
    });
    var max = niceMax(Math.max.apply(null, vals));
    var ys = yScale(plotH, padTop, max);
    var xs = function (i) { return R.years.length === 1 ? padL + plotW / 2 : padL + (i / (R.years.length - 1)) * plotW; };
    var grid = [0, 0.25, 0.5, 0.75, 1].map(function (f) {
      var y = padTop + f * plotH, v = Math.round(max * (1 - f));
      return '<line x1="' + padL + '" y1="' + y + '" x2="' + (padL + plotW) + '" y2="' + y + '" class="grid"/>' +
        '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" class="ytick">' + v + '</text>';
    }).join('');
    var lines = metrics.map(function (m) {
      var pts = R.years.map(function (y, i) { return [xs(i), ys(R.flow[y][type][m[0]])]; });
      var dots = pts.map(function (p, i) {
        return '<circle class="hit" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="9" fill="transparent" ' +
          'data-tip="<b>' + m[1] + ' ' + R.years[i] + '</b><br>' + R.flow[R.years[i]][type][m[0]] + '"/>' +
          '<circle class="dot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="' + m[2] + '"/>';
      }).join('');
      return '<path d="' + linePath(pts) + '" fill="none" stroke="' + m[2] + '" stroke-width="2.5" stroke-linejoin="round"/>' + dots;
    }).join('');
    var xl = R.years.map(function (y, i) { return '<text x="' + xs(i) + '" y="' + (H - 6) + '" class="xtick">' + y + '</text>'; }).join('');
    var legend = '<div class="chart-legend">' + metrics.map(function (m) {
      return '<span class="lg" style="color:' + m[2] + '"><span class="sw"></span>' + m[1] + '</span>';
    }).join('') + '</div>';
    return '<div class="chart-wrap">' + svgEl(W, H, grid + lines + xl, R.typeLabels[type] + ' received, closed and year-end stock, 2023–2025') + '<div class="tooltip"></div></div>' + legend;
  }

  // ---- View: Rulings by type & flow (Task 14) ----
  function viewRFlow() {
    var c = R.flow[rFlowYear][rFlowType], o = c.outcomes;
    var waterfall = buildWaterfall(c.begin, c.received, c.closed, c.end, {
      title: R.typeLabels[rFlowType] + ' ' + rFlowYear + ' stock flow: begin plus received minus closed equals end'
    });
    var reconciles = (c.begin + c.received - c.closed) === c.end;
    var outRows = [
      ['(Partly) granted',   o.granted,        'var(--brand-green-500)'],
      ['Rejected',           o.rejected,       'var(--danger)'],
      ['Withdrawn',          o.withdrawn,      'var(--accent-ochre)'],
      ['Out of treatment',   o.outOfTreatment, 'var(--neutral-400)'],
      ['No int’l character', o.noIntl,    'var(--brand-navy-300)']
    ];
    var maxO = Math.max.apply(null, outRows.map(function (r) { return r[1]; }).concat([1]));
    var closedTotal = outRows.reduce(function (a, r) { return a + r[1]; }, 0);
    var outBars = outRows.map(function (r) {
      var pct = closedTotal ? (r[1] / closedTotal * 100).toFixed(1) : '0';
      return '<div class="obar"><span class="olabel">' + r[0] + '</span>' +
        '<span class="otrack" title="' + pct + '% of closed"><span class="ofill" style="width:' + (r[1] / maxO * 100).toFixed(1) + '%;background:' + r[2] + '"></span></span>' +
        '<span class="oval">' + r[1] + '</span></div>';
    }).join('');
    var types = R.types.map(function (t) {
      return '<button class="chip plain' + (t === rFlowType ? ' on' : '') + '" data-rft="' + t + '"' + titleAttr(t) + '>' + R.typeLabels[t] + '</button>';
    }).join('');
    var years = R.years.map(function (y) {
      return '<button class="chip plain' + (y === rFlowYear ? ' on' : '') + '" data-rfy="' + y + '">' + y + '</button>';
    }).join('');
    return '<div class="view-head"><h2>By type &amp; flow</h2>' +
      '<p class="lede">Stock movement, closing outcomes and the multi-year trend for one ruling type.</p></div>' +
      '<div class="chip-row" id="rfTypes"><span class="chip-label">Type</span>' + types + '</div>' +
      '<div class="chip-row" id="rfYears"><span class="chip-label">Year</span>' + years + '</div>' +
      '<div class="panel"><h4>Stock flow ' + rFlowYear + ' <small>' + R.typeLabels[rFlowType] + '</small></h4>' +
      '<div class="chart-wrap">' + waterfall + '<div class="tooltip"></div></div>' +
      '<p class="partner-foot">' + c.begin + ' + ' + c.received + ' − ' + c.closed + ' = <strong style="color:var(--fg-1)">' + c.end + '</strong>' +
      (reconciles ? '' : ' ⚠️ does not reconcile') + '</p></div>' +
      '<div class="panel"><h4>Outcome split ' + rFlowYear + ' <small>of ' + closedTotal + ' closed</small></h4><div class="outcols">' + outBars + '</div></div>' +
      '<div class="panel"><h4>Received, closed &amp; year-end stock <small>2023–2025</small></h4>' + buildTypeTrend(rFlowType) + '</div>';
  }

  // ---- View: Rulings processing times (Task 15) ----
  // Dumbbell: time-to-a-granted-ruling per type, 2024 dot → 2025 dot, line
  // coloured by direction (green = faster in 2025, red = slower). The 'granted'
  // outcome is the headline metric and the only one with complete 2024+2025 data.
  function rulingTimingDelta() {
    var metric = 'granted';
    var rows = R.types.map(function (t) {
      return { t: t, a: R.processingTime[2024][t][metric], b: R.processingTime[2025][t][metric] };
    }).filter(function (r) { return r.a != null && r.b != null; });
    var W = 720, rowH = 44, padTop = 14, padB = 30, padL = 150, padR = 88;
    var H = padTop + rows.length * rowH + padB;
    var plotW = W - padL - padR;
    var maxV = 1;
    rows.forEach(function (r) { maxV = Math.max(maxV, r.a, r.b); });
    var max = niceMax(maxV);
    var xs = function (v) { return padL + (v / max) * plotW; };
    var ticks = [0, 0.25, 0.5, 0.75, 1].map(function (f) {
      var v = Math.round(max * f), x = xs(v);
      return '<line x1="' + x.toFixed(1) + '" y1="' + padTop + '" x2="' + x.toFixed(1) + '" y2="' + (H - padB) + '" class="grid"/>' +
        '<text x="' + x.toFixed(1) + '" y="' + (H - padB + 16) + '" class="xtick">' + v + '</text>';
    }).join('');
    var body = rows.map(function (r, i) {
      var y = padTop + i * rowH + rowH / 2;
      var d = r.b - r.a;
      var col = d < 0 ? 'var(--brand-green-500)' : d > 0 ? 'var(--danger)' : 'var(--neutral-400)';
      var dlabel = (d > 0 ? '+' : d < 0 ? '−' : '±') + Math.abs(d) + ' mo';
      var xa = xs(r.a), xb = xs(r.b);
      var tip = '<b>' + R.typeLabels[r.t] + '</b><br>2024: ' + r.a + ' mo → 2025: ' + r.b + ' mo<br>' +
        (d === 0 ? 'no change' : (d < 0 ? Math.abs(d) + ' mo faster' : d + ' mo slower'));
      return '<text x="' + (padL - 12) + '" y="' + (y + 4).toFixed(1) + '" class="db-lbl">' + RTYPE_SHORT[r.t] + '</text>' +
        '<line x1="' + xa.toFixed(1) + '" y1="' + y.toFixed(1) + '" x2="' + xb.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="' + col + '" stroke-width="3" stroke-linecap="round"/>' +
        '<circle cx="' + xa.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="5.5" fill="var(--surface)" stroke="var(--neutral-400)" stroke-width="2"/>' +
        '<circle cx="' + xb.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="5.5" fill="var(--brand-navy-600)"/>' +
        '<rect class="hit" x="' + padL + '" y="' + (y - rowH / 2).toFixed(1) + '" width="' + plotW + '" height="' + rowH + '" fill="transparent" data-tip="' + tip + '"/>' +
        '<text x="' + (W - padR + 10) + '" y="' + (y + 4).toFixed(1) + '" class="db-delta" fill="' + col + '">' + dlabel + '</text>';
    }).join('');
    return svgEl(W, H, ticks + body, 'Time to a granted ruling by type, 2024 versus 2025');
  }

  function viewRTiming() {
    var pt = R.processingTime[rtYear];
    var outs = [
      ['granted',        '(Partly) granted'],
      ['rejected',       'Rejected'],
      ['withdrawn',      'Withdrawn'],
      ['outOfTreatment', 'Out of treatment']
    ];
    // Shade scale: deepest tint at the longest gross time in the table.
    var maxMo = 1;
    outs.forEach(function (o) {
      R.types.forEach(function (t) { var v = pt[t][o[0]]; if (v != null && v > maxMo) maxMo = v; });
    });
    var head = '<tr><th class="corner"></th>' + R.types.map(function (t) { return '<th' + titleAttr(t) + '>' + RTYPE_SHORT[t] + '</th>'; }).join('') + '</tr>';
    var rows = outs.map(function (o) {
      return '<tr><td class="rowlbl">' + o[1] + '</td>' + R.types.map(function (t) {
        var v = pt[t][o[0]];
        if (v == null) return '<td class="cell na">—</td>';
        var aNum = 0.10 + 0.85 * (v / maxMo);
        var tone = aNum >= 0.5 ? ' hi' : '';   // hi = heavily tinted → flip text colour for contrast
        return '<td class="cell' + tone + '" style="--a:' + aNum.toFixed(3) + '" title="' + R.typeLabels[t] + ' · ' + o[1] + ': ' + v + ' months">' + v + '</td>';
      }).join('') + '</tr>';
    }).join('');
    var years = [2024, 2025].map(function (y) {
      return '<button class="chip plain' + (y === rtYear ? ' on' : '') + '" data-rty="' + y + '">' + y + '</button>';
    }).join('');
    var ps = R.publishedSummaries2025;
    var psLine = 'Published summaries 2025: ATR ' + ps.ATR + ' · APA/BAPA ' + ps['APA/BAPA'] + ' · Innovation box ' + ps.Innovatiebox + ' · Other ' + ps.Overige;
    return '<div class="view-head"><h2>Processing times</h2>' +
      '<p class="lede">' + gloss('Gross processing time', 'GROSS') + ' in months, by ruling type and closing outcome.</p></div>' +
      '<div class="chip-row" id="rtYears"><span class="chip-label">Year</span>' + years + '</div>' +
      '<div class="chart-card"><div class="heat-wrap"><table class="heat"><thead>' + head + '</thead><tbody>' + rows + '</tbody></table></div>' +
      '<p class="note">' + psLine + '</p>' +
      '<p class="note">' + R.processingNote + '</p></div>' +
      '<div class="panel"><h4>How timing shifted — 2024 → 2025 <small>time to a granted ruling, gross months; the dot moves from 2024 to 2025</small></h4>' +
      '<div class="chart-wrap">' + rulingTimingDelta() + '<div class="tooltip"></div></div>' +
      '<div class="chart-legend">' +
        '<span class="lg" style="color:var(--fg-3)"><span class="db-sw open"></span>2024</span>' +
        '<span class="lg" style="color:var(--brand-navy-600)"><span class="db-sw filled"></span>2025</span>' +
        '<span class="lg" style="color:var(--brand-green-600)"><span class="sw"></span>faster in 2025</span>' +
        '<span class="lg" style="color:var(--danger)"><span class="sw"></span>slower in 2025</span>' +
      '</div></div>';
  }

  // ---- View: Rulings defining positions (Task 15) ----
  function viewRPositions() {
    function cards(group) {
      return R.positions.filter(function (p) { return p.group === group; }).map(function (p) {
        return '<article class="position"><p class="eyebrow">inRange view · ' + p.source + '</p>' +
          '<h3>' + p.icon + ' ' + p.title + '</h3><p>' + p.body + '</p></article>';
      }).join('');
    }
    return '<div class="view-head"><h2>Defining positions</h2>' +
      '<p class="lede">Selected defining positions from the ruling practice, read through a transfer-pricing lens — inRange’s own commentary.</p></div>' +
      '<h4 class="pos-group">Transfer pricing</h4><div class="positions">' + cards('TP') + '</div>' +
      '<h4 class="pos-group">Access conditions</h4><div class="positions">' + cards('Access') + '</div>';
  }

  // ---- Render functions ----

  function renderHero() {
    var A = AREAS[area];
    document.getElementById('heroTitle').innerHTML = A.title;
    document.getElementById('heroLede').textContent = A.lede;
    document.getElementById('areaSwitch').innerHTML = Object.keys(AREAS).map(function (key) {
      return '<button class="seg' + (key === area ? ' on' : '') + '" data-area="' + key + '">' +
        AREAS[key].label + '</button>';
    }).join('');
    var tiles = A.kpis();
    document.getElementById('kpis').innerHTML = tiles.map(function (t) {
      return '<div class="kf"><small>' + t[0] + '</small><strong>' + t[1] +
        (t[2] ? ' <span class="delta">' + t[2] + '</span>' : '') + '</strong></div>';
    }).join('');
    document.getElementById('kpiNote').textContent = 'Headline figures are for FY2025; the green figure is the change versus FY2024.';
  }

  function renderTabs() {
    var A = AREAS[area];
    document.getElementById('tabs').innerHTML = A.tabs.map(function (t, i) {
      return '<button class="tab-btn' + (t.id === active ? ' active' : '') +
        '" data-tab="' + t.id + '"><span class="tnum">' + (i + 1) + '</span>' + t.label + '</button>';
    }).join('');
  }

  function renderView() {
    var views = document.getElementById('views');
    var html;
    switch (active) {
      // ---- MAP & APA views ----
      case 'caseload':  html = viewCaseload();  break;
      case 'inventory': html = viewInventory(); break;
      case 'outcomes':  html = viewOutcomes();  break;
      case 'timing':    html = viewTiming();    break;
      case 'tp':        html = viewTp();        break;
      // ---- International Rulings views (Tasks 13-15) ----
      case 'rOverview':  html = viewROverview();  break;
      case 'rFlow':      html = viewRFlow();      break;
      case 'rTiming':    html = viewRTiming();    break;
      case 'rPositions': html = viewRPositions(); break;
      default:
        html = '<div class="view-placeholder">Unknown view.</div>';
    }
    views.innerHTML = html;

    // Re-wire tooltips: each .chart-wrap owns its own .tooltip, so wire per-wrap.
    views.querySelectorAll('.chart-wrap').forEach(function (wrap, i) {
      if (!wrap.id) wrap.id = '__cw' + i;
      wireTips(wrap.id);
    });
  }

  // Area-aware footer: the active area's published sources + the shared
  // methodology caveat(s) + a "data through FY2025" stamp. For the rulings
  // area we also surface the gross-vs-net processing caveat here (the rTiming
  // view shows its own copy inline; the footer carries the methodology stamp).
  function renderFooter() {
    var A = AREAS[area];
    var data = area === 'map' ? MAP_DATA : RULINGS_DATA;
    var src = data.sources.map(function (s) {
      return '<li>' + s.title + '</li>';
    }).join('');
    var notes = '<p class="note">' +
      (area === 'map' ? MAP_DATA.methodologyNote : RULINGS_DATA.processingNote) +
      '</p>';
    var stamp = 'Data through FY2025 · figures are the authorities’ published counts.';
    document.getElementById('footer').innerHTML =
      '<div class="footer-grid">' +
        '<div class="footer-sources">' +
          '<h4>Sources · ' + A.label + '</h4>' +
          '<ul class="srclist">' + src + '</ul>' +
        '</div>' +
        '<div class="footer-notes">' +
          '<h4>Methodology</h4>' +
          notes +
          '<p class="note footer-stamp">' + stamp + '</p>' +
        '</div>' +
      '</div>';
  }

  function render() { renderHero(); renderTabs(); renderView(); renderFooter(); }

  // ---- Event: area switch ----
  document.getElementById('areaSwitch').addEventListener('click', function (e) {
    var b = e.target.closest('[data-area]');
    if (!b) return;
    area   = b.getAttribute('data-area');
    active = AREAS[area].tabs[0].id; // reset to first sub-tab of the new area
    render();
  });

  // ---- Event: tab clicks ----
  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]');
    if (!b) return;
    active = b.getAttribute('data-tab');
    render();
  });

  // ---- Event: per-view controls (delegated once on the stable #views) ----
  document.getElementById('views').addEventListener('click', function (e) {
    var b;
    if ((b = e.target.closest('[data-cl]')))   { var k = b.getAttribute('data-cl'); caseloadOn[k] = !caseloadOn[k]; render(); return; }
    if ((b = e.target.closest('[data-invy]')))  { invYear = +b.getAttribute('data-invy'); render(); return; }
    if ((b = e.target.closest('[data-invs]')))  { invStream = b.getAttribute('data-invs'); render(); return; }
    if ((b = e.target.closest('[data-outy]')))  { outYear = +b.getAttribute('data-outy'); render(); return; }
    // ---- Rulings controls ----
    if ((b = e.target.closest('[data-ry]')))    { rYear = +b.getAttribute('data-ry'); render(); return; }
    if ((b = e.target.closest('[data-rtm]')))   { rTrendMetric = b.getAttribute('data-rtm'); render(); return; }
    if ((b = e.target.closest('[data-rft]')))   { rFlowType = b.getAttribute('data-rft'); render(); return; }
    if ((b = e.target.closest('[data-rfy]')))   { rFlowYear = +b.getAttribute('data-rfy'); render(); return; }
    if ((b = e.target.closest('[data-rty]')))   { rtYear = +b.getAttribute('data-rty'); render(); return; }
  });

  // ---- Init ----
  render();

})();
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <!-- BACKGROUND: navy fallback under bottom strip -->
  <rect width="1200" height="630" fill="#0D1B2D"/>

  <!-- LEFT panel: Sprint (green) -->
  <rect x="0" y="0" width="600" height="540" fill="#1FA84A"/>

  <!-- RIGHT panel: Death Run (deep red) -->
  <rect x="600" y="0" width="600" height="540" fill="#B91C1C"/>

  <!-- BOTTOM strip: navy -->
  <rect x="0" y="540" width="1200" height="90" fill="#0D1B2D"/>

  <!-- inRange brand: 3-bar mark + wordmark, top-left of left panel -->
  <g transform="translate(50, 55)">
    <rect x="0"  y="22" width="10" height="20" rx="2" fill="#FFFFFF"/>
    <rect x="14" y="10" width="10" height="32" rx="2" fill="#FFFFFF"/>
    <rect x="28" y="0"  width="10" height="42" rx="2" fill="#FFFFFF"/>
    <text x="50" y="34" font-weight="800" font-size="30" fill="#FFFFFF" letter-spacing="-0.5">inRange</text>
  </g>

  <!-- LEFT: SPRINT eyebrow -->
  <text x="50" y="170" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="6">SPRINT</text>

  <!-- LEFT: big "5" -->
  <text x="300" y="395" font-weight="900" font-size="240" fill="#FFFFFF" text-anchor="middle">5</text>

  <!-- LEFT: "questions" sublabel -->
  <text x="300" y="450" font-weight="600" font-size="42" fill="#FFFFFF" text-anchor="middle">questions</text>

  <!-- LEFT: tagline -->
  <text x="300" y="500" font-weight="500" font-size="22" fill="#FFFFFF" opacity="0.85" text-anchor="middle">Quick gut-check</text>

  <!-- RIGHT: DEATH RUN eyebrow -->
  <text x="650" y="170" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="6">DEATH RUN</text>

  <!-- RIGHT: big skull (Lucide-derived paths, scaled via nested svg) -->
  <svg x="780" y="200" width="240" height="240" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20"/>
    <circle cx="9" cy="12" r="1"/>
    <circle cx="15" cy="12" r="1"/>
    <path d="M8 20v2h8v-2"/>
    <path d="m12.5 17-.5-1-.5 1h1z"/>
  </svg>

  <!-- RIGHT: tagline -->
  <text x="900" y="500" font-weight="500" font-size="22" fill="#FFFFFF" opacity="0.85" text-anchor="middle">Until you miss</text>

  <!-- BOTTOM strip text -->
  <text x="600" y="592" font-weight="500" font-size="24" fill="#FFFFFF" text-anchor="middle">Test your TP skills in this OECD-based quiz (including the latest draft Chapter VII additions)</text>
</svg>

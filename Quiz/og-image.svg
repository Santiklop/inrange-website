<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <!-- background -->
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- eyebrow -->
  <text x="80" y="142" font-weight="700" font-size="20" fill="#C9882B" letter-spacing="3">INRANGE OPEN PRACTICE · TP QUIZ</text>

  <!-- title -->
  <text x="80" y="224" font-weight="800" font-size="64" fill="#0D1B2D" letter-spacing="-1.8">Sprint or Death Run.</text>
  <text x="80" y="294" font-weight="800" font-size="64" fill="#0D1B2D" letter-spacing="-1.8">Pick your poison.</text>

  <!-- lede -->
  <text x="80" y="358" font-weight="500" font-size="24" fill="#343D4C">Five questions, or a streak until you miss one. Across all six chapters.</text>

  <!-- bottom chips -->
  <g transform="translate(80, 432)">
    <!-- Sprint chip -->
    <rect width="200" height="52" rx="26" fill="#FFFFFF" stroke="#1FA84A" stroke-width="1.5"/>
    <circle cx="30" cy="26" r="6" fill="#1FA84A"/>
    <text x="50" y="33" font-weight="600" font-size="17" fill="#0F6B2E">Sprint · 5 questions</text>

    <!-- Death Run chip -->
    <g transform="translate(220, 0)">
      <rect width="260" height="52" rx="26" fill="#F8E9CC" stroke="#C9882B" stroke-width="1.5"/>
      <circle cx="30" cy="26" r="6" fill="#C9882B"/>
      <text x="50" y="33" font-weight="600" font-size="17" fill="#7F5615">Death Run · until you miss</text>
    </g>

    <!-- ~100 chip -->
    <g transform="translate(500, 0)">
      <rect width="240" height="52" rx="26" fill="#FFFFFF" stroke="#9FDFB1" stroke-width="1.5"/>
      <text x="22" y="33" font-weight="600" font-size="17" fill="#0F6B2E">~100 questions on tap</text>
    </g>
  </g>

  <!-- right-side decoration: stacked answer-card outlines -->
  <g transform="translate(896, 130)">
    <rect x="40" y="48" width="240" height="180" rx="14" fill="#FFFFFF" stroke="#DEE2E8" stroke-width="1.5" opacity="0.55"/>
    <rect x="20" y="24" width="240" height="180" rx="14" fill="#FFFFFF" stroke="#DEE2E8" stroke-width="1.5" opacity="0.85"/>
    <rect width="240" height="180" rx="14" fill="#FFFFFF" stroke="#C9882B" stroke-width="2"/>

    <text x="20" y="34" font-weight="700" font-size="11" fill="#C9882B" letter-spacing="2">DEATH RUN</text>
    <text x="20" y="76" font-weight="800" font-size="36" fill="#C9882B">STREAK</text>
    <text x="20" y="116" font-weight="800" font-size="48" fill="#0D1B2D">23</text>
    <text x="20" y="140" font-weight="600" font-size="14" fill="#343D4C">in a row</text>
    <line x1="20" y1="156" x2="220" y2="156" stroke="#EEF0F3" stroke-width="1.5"/>

    <g transform="translate(20, 168)">
      <rect width="200" height="32" rx="6" fill="#C9882B"/>
      <text x="100" y="21" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">Share your streak</text>
    </g>
  </g>
</svg>
